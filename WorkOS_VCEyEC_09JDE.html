<h3>Decisiones de arquitectura</h3>
<table>
<tr><th>Decisión</th><th>Elección</th><th>Por qué</th></tr>
<tr><td>Estilo</td><td>Monolito modular, separable en servicios</td><td>El volumen de una Junta Distrital no justifica microservicios. Los módulos se comunican por eventos internos, así que pueden separarse después sin reescribirlos.</td></tr>
<tr><td>Base de datos</td><td>PostgreSQL con columnas JSONB</td><td>Integridad relacional para jerarquía, permisos y auditoría; flexibilidad documental para las columnas mutables de cada tablero.</td></tr>
<tr><td>Tiempo real</td><td>WebSocket por tablero + Redis pub/sub</td><td>Quien tiene abierto el tablero ve los cambios de cualquier celda en menos de un segundo, incluidos los que hacen las automatizaciones.</td></tr>
<tr><td>Eventos</td><td>Patrón outbox transaccional</td><td>El cambio y su evento se guardan en la misma transacción: ninguna automatización se pierde ni se ejecuta dos veces.</td></tr>
<tr><td>Identidad</td><td>SSO institucional + control de acceso por roles</td><td>Altas y bajas de cuentas las administra el área de informática, no la aplicación.</td></tr>
</table>

<section data-sec="datos" data-title="1. Arquitectura de datos">
<h2>1. Arquitectura de datos</h2>
<p class="lead">Modelo híbrido: tablas relacionales para la estructura (organización, espacios, tableros, grupos, elementos, permisos y auditoría) y un documento JSONB por elemento para los valores de las columnas mutables.</p>
<h3>Por qué híbrido</h3>
<ul>
<li><b>Lo estable es relacional.</b> La jerarquía, la pertenencia y los permisos necesitan llaves foráneas, borrado en cascada y seguridad a nivel de fila.</li>
<li><b>Lo que cambia por tablero es documental.</b> Cada tablero define sus propias columnas. Agregar la columna «Evidencia» no requiere migrar la base: es una fila en <code>board_columns</code> y una llave nueva en <code>column_values</code>.</li>
<li><b>Lo que se consulta mucho se proyecta.</b> Estado, fecha límite y responsables se copian a columnas indexadas para filtrar y ordenar rápido sin recorrer el JSON.</li>
</ul>

<h3>Esquema (PostgreSQL 16)</h3>
<pre><code><span class="c">-- Personas que pueden ser responsables de una tarea.</span>
<span class="k">CREATE TABLE</span> principals (
  id          uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  org_id      uuid NOT NULL,
  kind        text NOT NULL CHECK (kind IN ('user')),
  display     text NOT NULL,
  created_at  timestamptz NOT NULL DEFAULT now()
);

<span class="k">CREATE TABLE</span> organizations (
  id    uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  name  text NOT NULL                                    <span class="c">-- Instituto Nacional Electoral</span>
);

<span class="k">CREATE TABLE</span> workspaces (
  id      uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  org_id  uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
  name    text NOT NULL                                  <span class="c">-- 09 JDE · Vocalía de Capacitación Electoral</span>
);

<span class="k">CREATE TABLE</span> boards (
  id            uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  workspace_id  uuid NOT NULL REFERENCES workspaces(id) ON DELETE CASCADE,
  name          text NOT NULL,
  settings      jsonb NOT NULL DEFAULT '{}',              <span class="c">-- umbrales del semáforo, vista por defecto</span>
  created_by    uuid REFERENCES principals(id),
  created_at    timestamptz NOT NULL DEFAULT now()
);

<span class="k">CREATE TABLE</span> board_columns (
  board_id    uuid NOT NULL REFERENCES boards(id) ON DELETE CASCADE,
  id          text NOT NULL,                              <span class="c">-- llave estable: 'status', 'due', 'col_7f2a'</span>
  title       text NOT NULL,
  type        text NOT NULL CHECK (type IN
                ('text','status','people','date','timeline','number','formula','link')),
  settings    jsonb NOT NULL DEFAULT '{}',                <span class="c">-- etiquetas y colores, expresión, formato</span>
  sort_order  numeric NOT NULL,
  PRIMARY KEY (board_id, id)
);

<span class="k">CREATE TABLE</span> board_groups (
  id          uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  board_id    uuid NOT NULL REFERENCES boards(id) ON DELETE CASCADE,
  title       text NOT NULL,                              <span class="c">-- Objetivos semanales / mensuales</span>
  sort_order  numeric NOT NULL                            <span class="c">-- índice fraccional: reordenar no reescribe filas</span>
);

<span class="k">CREATE TABLE</span> items (
  id              uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  board_id        uuid NOT NULL REFERENCES boards(id) ON DELETE CASCADE,
  group_id        uuid NOT NULL REFERENCES board_groups(id),
  parent_item_id  uuid REFERENCES items(id) ON DELETE CASCADE,   <span class="c">-- sub-elementos</span>
  name            text NOT NULL,
  column_values   jsonb NOT NULL DEFAULT '{}',
  sort_order      numeric NOT NULL,
  version         integer NOT NULL DEFAULT 1,             <span class="c">-- concurrencia optimista</span>
  created_by      uuid REFERENCES principals(id),
  created_at      timestamptz NOT NULL DEFAULT now(),
  updated_at      timestamptz NOT NULL DEFAULT now(),
  <span class="c">-- proyecciones para filtrar y ordenar sin recorrer el JSON</span>
  status_key      text GENERATED ALWAYS AS (column_values -&gt; 'status' -&gt;&gt; 'label') STORED,
  due_date        date,                                   <span class="c">-- la escribe el servicio al guardar la columna «due»</span>
  last_light      text                                    <span class="c">-- último color de semáforo procesado</span>
);

<span class="c">-- Proyección de la columna «Personas»: a quién está asignado cada elemento.</span>
<span class="k">CREATE TABLE</span> item_assignees (
  item_id       uuid REFERENCES items(id) ON DELETE CASCADE,
  column_id     text NOT NULL,
  principal_id  uuid REFERENCES principals(id),
  PRIMARY KEY (item_id, column_id, principal_id)
);

<span class="c">-- Organigrama: puestos y línea de mando; holder_id NULL = vacante «por designar».</span>
<span class="k">CREATE TABLE</span> positions (
  id            uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  workspace_id  uuid NOT NULL REFERENCES workspaces(id),
  title         text NOT NULL,                            <span class="c">-- Técnico/a en Capacitación Electoral</span>
  reports_to    uuid REFERENCES positions(id),
  is_staff      boolean NOT NULL DEFAULT false,           <span class="c">-- unidad de apoyo (Asistente)</span>
  holder_id     uuid REFERENCES principals(id)
);

<span class="c">-- Rol por ámbito y permisos que el Vocal delega al Asistente.</span>
<span class="k">CREATE TABLE</span> memberships (
  principal_id  uuid REFERENCES principals(id),
  scope_type    text CHECK (scope_type IN ('organization','workspace','board')),
  scope_id      uuid NOT NULL,
  role          text NOT NULL CHECK (role IN ('vocal','asistente','colaborador')),
  PRIMARY KEY (principal_id, scope_type, scope_id)
);
<span class="k">CREATE TABLE</span> permission_grants (
  principal_id  uuid REFERENCES principals(id),
  scope_id      uuid NOT NULL,
  permission    text NOT NULL,                            <span class="c">-- 'items.create', 'comms.issue'…</span>
  allowed       boolean NOT NULL,
  granted_by    uuid NOT NULL REFERENCES principals(id),
  granted_at    timestamptz NOT NULL DEFAULT now(),
  PRIMARY KEY (principal_id, scope_id, permission)
);

<span class="c">-- Historial de cumplimiento de objetivos por periodo (semana ISO o mes).</span>
<span class="k">CREATE TABLE</span> objective_periods (
  item_id       uuid REFERENCES items(id) ON DELETE CASCADE,
  period_kind   text CHECK (period_kind IN ('week','month')),
  period_start  date NOT NULL,
  target        numeric, achieved numeric, unit text,
  closed_at     timestamptz,
  PRIMARY KEY (item_id, period_start)
);

<span class="c">-- Recordatorios y apercibimientos con respaldo documental.</span>
<span class="k">CREATE TABLE</span> communications (
  id            uuid PRIMARY KEY DEFAULT gen_random_uuid(),
  folio         text UNIQUE NOT NULL,                     <span class="c">-- INE/BC/JDE09/VCEyEC/0001/2026</span>
  kind          text CHECK (kind IN ('recordatorio','apercibimiento')),
  item_id       uuid REFERENCES items(id),
  recipient_id  uuid REFERENCES principals(id),
  body          text NOT NULL,
  body_sha256   bytea NOT NULL,
  issued_by     uuid REFERENCES principals(id),
  issued_at     timestamptz NOT NULL DEFAULT now(),
  status        text NOT NULL DEFAULT 'generado',         <span class="c">-- generado | enviado | acuse</span>
  ack_at        timestamptz
);

<span class="c">-- Auditoría: solo inserción y encadenada (hash = SHA-256(prev_hash ‖ registro)).</span>
<span class="k">CREATE TABLE</span> audit_log (
  seq          bigserial PRIMARY KEY,
  occurred_at  timestamptz NOT NULL DEFAULT now(),
  actor_id     uuid, actor_kind text NOT NULL,            <span class="c">-- user | system</span>
  action       text NOT NULL,
  entity_type  text, entity_id uuid,
  before       jsonb, after jsonb,
  prev_hash    bytea NOT NULL,
  hash         bytea NOT NULL
);
<span class="k">REVOKE</span> UPDATE, DELETE, TRUNCATE ON audit_log FROM app_rw;</code></pre>

<h3>Columnas mutables: tipos y contrato de valores</h3>

<tr><th>Tipo</th><th>Valor en <code>column_values</code></th><th>Configuración (<code>settings</code>)</th><th>Uso en este tablero</th></tr>

<h3>Fórmulas</h3>
<p>Las expresiones se analizan con un intérprete propio (sin <code>eval</code>): se convierten en un árbol sintáctico con una lista cerrada de funciones (<code>TODAY</code>, <code>DAYS</code>, <code>IF</code>, <code>ROUND</code>, <code>MIN</code>, <code>MAX</code>, <code>CONCAT</code>, <code>BLANK</code>). Las referencias <code>{columna}</code> forman un grafo de dependencias por tablero; si al guardar una columna aparece un ciclo, la definición se rechaza. Al cambiar un valor solo se recalculan las fórmulas que dependen de él, y las que usan <code>TODAY()</code> se recalculan con un proceso diario a las 00:05 (America/Tijuana) y al leer.</p>
<p>Las fechas se manejan como días calendario en UTC. Tecate cambia de horario en verano: calcular con horas locales haría que algunos días midieran 23 o 25 horas y el semáforo se desfasara.</p>

<h3>Objetivos semanales y mensuales</h3>
<p>Cada tarea pertenece a un grupo (semanal o mensual), tiene una meta numérica con unidad, un avance y una fecha límite. Al cerrar el periodo, su resultado se guarda en <code>objective_periods</code> y la tarea puede renovarse para el periodo siguiente con la misma meta. Así el Vocal conserva el historial de cumplimiento por persona y por semana.</p>

<h3>Índices, seguridad por fila y concurrencia</h3>
<pre><code><span class="k">CREATE INDEX</span> items_board_group ON items (board_id, group_id, sort_order);
<span class="k">CREATE INDEX</span> items_due_open    ON items (board_id, due_date) WHERE status_key IS DISTINCT FROM 'listo';
<span class="k">CREATE INDEX</span> items_values_gin  ON items USING gin (column_values jsonb_path_ops);
<span class="k">CREATE INDEX</span> assignees_by_who  ON item_assignees (principal_id);

<span class="c">-- Cada consulta solo ve los tableros de los espacios a los que pertenece quien pregunta.</span>
<span class="k">ALTER TABLE</span> items ENABLE ROW LEVEL SECURITY;
<span class="k">CREATE POLICY</span> items_por_espacio ON items USING (
  board_id IN (SELECT b.id FROM boards b
               JOIN memberships m ON m.scope_id = b.workspace_id
               WHERE m.principal_id = current_setting('app.principal')::uuid)
);</code></pre>
<ul>
<li><b>Concurrencia optimista:</b> cada edición envía la <code>version</code> que conoce; si otra persona guardó antes, el servidor responde 409 y el cliente recarga solo esa tarea.</li>
<li><b>Tiempo real:</b> el servidor publica cada cambio en el canal <code>board:{id}</code>; los clientes aplican el parche a su almacén local sin recargar el tablero.</li>
<li><b>Textos largos colaborativos</b> (indicaciones, actualizaciones) usan documentos CRDT (Yjs) para que dos personas escriban a la vez sin perder texto.</li>
</ul>
</section>

<h2>2. Motor de automatizaciones (sin código)</h2>
<p class="lead">Cada regla tiene tres partes: un disparador (lo que cambió), condiciones opcionales (a qué tareas aplica) y una o más acciones (qué hacer). Las reglas se guardan como datos y se configuran en pantalla, sin programar.</p>

<h3>Catálogo inicial</h3>
<table>
<tr><th>Disparadores</th><th>Condiciones</th><th>Acciones</th></tr>
<tr><td>El estado cambia a… · El semáforo cambia a… · Se asigna una tarea · Se crea una tarea · El avance alcanza la meta · Llega una fecha · Cada día o semana a cierta hora</td><td>Periodicidad (semanal / mensual) · Prioridad · Figura del responsable · Responsable · Grupo · Cualquier columna con operador (es, no es, mayor que, contiene)</td><td>Notificar al responsable, al Vocal o al Asistente · Enviar webhook (Slack u otro) · Preparar recordatorio o apercibimiento · Cambiar una columna · Publicar una actualización · Crear sub-elemento</td></tr>
</table>

<h3>Garantías del motor</h3>
<ul>
<li><b>Ninguna ejecución se pierde:</b> el evento se escribe en la misma transacción que el cambio (outbox). Si el bus se cae, el relay lo publica al volver.</li>
<li><b>Ninguna acción se repite:</b> cada acción lleva la llave <code>regla:evento:índice</code>; un reintento con la misma llave no se ejecuta dos veces.</li>
<li><b>Reintentos con espera exponencial:</b> hasta 5 intentos en errores 5xx o 429; después la acción pasa a una cola de errores y se avisa al administrador.</li>
<li><b>Sin ciclos:</b> cada cambio hecho por una automatización lleva una profundidad de causalidad; a partir de 3 encadenamientos se detiene y se registra.</li>
<li><b>Secretos fuera de la regla:</b> la URL del webhook se guarda como referencia (<code>secret://slack/vceyec-09</code>) y se resuelve al ejecutar.</li>
<li><b>Todo queda registrado:</b> cada ejecución deja su resultado en <code>automation_runs</code> y en la bitácora de auditoría.</li>
</ul>

<h3>Regla de ejemplo: «Listo» → notificar al responsable + webhook a Slack</h3>
<pre><code>{
  "id": "auto_listo_slack",
  "name": "Al marcar «Listo»: avisar al responsable y a Slack",
  "enabled": true,
  "trigger":    { "type": "column_changed", "column": "status", "to": "listo" },
  "conditions": [],
  "actions": [
    { "type": "notify", "to": "{{item.owner}}",
      "template": "La tarea «{{item.name}}» se marcó como Listo." },
    { "type": "webhook", "url": "secret://slack/vceyec-09", "method": "POST",
      "body": { "text": "✅ {{item.name}} — Listo · {{actor.name}} · {{board.name}}" } }
  ]
}</code></pre>

<h3>Lógica de backend (TypeScript)</h3>
<pre><code><span class="c">// 1 · El valor y su evento se guardan juntos (patrón outbox).</span>
<span class="k">async function</span> setColumnValue(itemId: string, col: string, value: Json, actor: Actor) {
  <span class="k">await</span> db.tx(<span class="k">async</span> (tx) =&gt; {
    <span class="k">const</span> item = <span class="k">await</span> tx.items.lockForUpdate(itemId);
    <span class="k">const</span> before = item.column_values[col];
    <span class="k">await</span> tx.items.patch(itemId, { [col]: value }, { expectedVersion: item.version });
    <span class="k">await</span> tx.outbox.insert({
      type: 'column_changed', boardId: item.board_id, itemId,
      payload: { column: col, before, after: value },
      actor, causationDepth: actor.causationDepth ?? 0,
    });
    <span class="k">await</span> tx.audit.append(actor, 'item.update', { itemId, col, before, after: value });
  });
}

<span class="c">// 2 · Emparejar reglas y encolar acciones.</span>
bus.subscribe('board-events', <span class="k">async</span> (evt: DomainEvent) =&gt; {
  <span class="k">if</span> (evt.causationDepth &gt;= MAX_DEPTH) <span class="k">return</span> runs.skip(evt, 'loop_guard');
  <span class="k">const</span> rules = <span class="k">await</span> ruleIndex.for(evt.boardId, evt.type);
  <span class="k">for</span> (<span class="k">const</span> rule <span class="k">of</span> rules) {
    <span class="k">if</span> (!rule.enabled || !matches(rule.trigger, evt)) <span class="k">continue</span>;
    <span class="k">const</span> ctx = <span class="k">await</span> buildContext(evt);                 <span class="c">// tarea, columnas, actor, tablero</span>
    <span class="k">if</span> (!rule.conditions.every((c) =&gt; evaluate(c, ctx))) <span class="k">continue</span>;
    rule.actions.forEach((action, i) =&gt;
      queue.add('automation-action', { ruleId: rule.id, action, evt, ctx }, {
        jobId: `${rule.id}:${evt.id}:${i}`,                  <span class="c">// idempotencia</span>
        attempts: 5, backoff: { type: 'exponential', delay: 2000 },
      }));
  }
});

<span class="c">// 3 · Ejecutores: una función por tipo de acción.</span>
<span class="k">const</span> executors: Record&lt;ActionType, Executor&gt; = {
  notify: ({ action, ctx }) =&gt;
    notifications.send(resolve(action.to, ctx), render(action.template, ctx)),
  webhook: <span class="k">async</span> ({ action, ctx }) =&gt; {
    <span class="k">const</span> url = <span class="k">await</span> secrets.get(action.url);
    <span class="k">const</span> res = <span class="k">await</span> http.post(url, render(action.body, ctx), { timeout: 5000 });
    <span class="k">if</span> (res.status &gt;= 500 || res.status === 429) <span class="k">throw new</span> RetryableError(res.status);
  },
  set_column: ({ action, ctx, evt }) =&gt;
    setColumnValue(ctx.item.id, action.column, action.value,
      { kind: 'automation', id: action.ruleId, causationDepth: evt.causationDepth + 1 }),
};
worker.process('automation-action', <span class="k">async</span> (job) =&gt; {
  <span class="k">await</span> executors[job.data.action.type](job.data);
  <span class="k">await</span> runs.record(job.data, 'succeeded');
});</code></pre>

<h3>Recorrido del ejemplo, paso a paso</h3>
<ol>
<li>La persona arrastra la tarjeta a «Listo» en el Kanban; el cliente envía <code>PATCH /items/{id}/values/status</code> con <code>{"label": "listo"}</code> y actualiza la vista de inmediato.</li>
<li>La API valida el permiso <code>items.update_status</code>, guarda el valor e inserta el evento <code>column_changed</code> en el outbox, en la misma transacción.</li>
<li>El relay publica el evento; el emparejador encuentra la regla <code>auto_listo_slack</code>. No tiene condiciones, así que encola sus dos acciones.</li>
<li>Acción 1: el responsable recibe la notificación en el sistema y en su correo institucional.</li>
<li>Acción 2: se envía a Slack <code>{"text": "✅ Captura de solicitudes… — Listo · Lic. … · Seguimiento de actividades"}</code>. Si Slack responde con error temporal, se reintenta.</li>
<li>Ambos resultados quedan en el registro de ejecuciones y en la auditoría, y el tablero de quien lo esté viendo se actualiza por WebSocket.</li>
</ol>
<h3>Eventos de tiempo: el semáforo</h3>
<p>Un programador revisa cada 15 minutos las tareas abiertas cuya fecha límite está dentro del umbral mayor, calcula su color y, si cambió respecto de <code>last_light</code>, emite <code>light_changed</code>. Así funcionan reglas como «si una tarea queda vencida, preparar apercibimiento para el Vocal».</p>
<pre><code><span class="k">SELECT</span> id, due_date, status_key, last_light
<span class="k">FROM</span> items
<span class="k">WHERE</span> board_id = $1
  <span class="k">AND</span> status_key IS DISTINCT FROM 'listo'
  <span class="k">AND</span> due_date &lt;= current_date + $2;   <span class="c">-- $2 = el umbral mayor (mensual)</span></code></pre>
<div class="callout"><b>En este archivo:</b> el apartado «Automatizaciones» ejecuta este mismo modelo en el navegador. El semáforo se revisa al iniciar sesión el Vocal o el Asistente y cada cinco minutos mientras trabajan; cada aviso de semáforo lleva una llave del evento, así que si dos computadoras detectan el mismo cambio, el aviso es uno solo. El webhook se envía de verdad si se configura la URL de Slack o, si no, se simula y se registra el contenido que se enviaría.</div>
</section>

<h3>Un solo origen de datos, varias vistas</h3>
<pre><code><span class="k">export function</span> BoardView({ boardId }: { boardId: string }) {
  <span class="k">const</span> board = useBoard(boardId);                <span class="c">// almacén normalizado + WebSocket</span>
  <span class="k">const</span> view = useViewConfig(boardId);            <span class="c">// tipo, filtros, orden, agrupación</span>
  <span class="k">const</span> rows = useMemo(() =&gt; selectView(board, view), [board, view]);
  <span class="k">switch</span> (view.type) {
    <span class="k">case</span> 'table':  <span class="k">return</span> &lt;DataGrid rows={rows} columns={board.columns} /&gt;;
    <span class="k">case</span> 'kanban': <span class="k">return</span> &lt;KanbanBoard rows={rows} laneColumn="status" /&gt;;
    <span class="k">case</span> 'gantt':  <span class="k">return</span> &lt;GanttChart rows={rows} startColumn="start" endColumn="due" /&gt;;
  }
}

<span class="c">// La vista es una función pura: filtra, ordena y agrupa sin copiar datos.</span>
<span class="k">function</span> selectView(board: Board, v: ViewConfig): Row[] {
  <span class="k">return</span> board.itemIds
    .map((id) =&gt; board.items[id])
    .filter((it) =&gt; matchesFilters(it, v.filters, board.columns))
    .sort(byColumn(v.sort, board.columns));
}</code></pre>

<h3>Vista de Tabla: grid dinámico</h3>
<ul>
<li>Las columnas vienen de <code>board_columns</code>; un registro elige el componente de cada celda según su tipo.</li>
<li>Virtualización de filas y columnas: cientos de tareas sin perder fluidez.</li>
<li>Edición en línea con actualización optimista: la celda cambia al instante y se revierte si el servidor responde con conflicto.</li>
<li>Primera columna fija, encabezados de grupo con totales, navegación con teclado entre celdas.</li>
</ul>
<pre><code><span class="k">const</span> cellRegistry: Record&lt;ColumnType, React.FC&lt;CellProps&gt;&gt; = {
  text: TextCell, status: StatusCell, people: PeopleCell, date: DateCell,
  timeline: TimelineCell, number: NumberCell, formula: FormulaCell, link: LinkCell,
};
<span class="k">function</span> GridCell({ item, column }: CellProps) {
  <span class="k">const</span> Cell = cellRegistry[column.type];
  <span class="k">return</span> &lt;Cell value={item.column_values[column.id]} column={column} item={item} /&gt;;
}</code></pre>

<h3>Vista Kanban: arrastrar y soltar</h3>
<ul>
<li>Los carriles salen de las etiquetas de la columna de estado, en su orden configurado.</li>
<li>Soltar una tarjeta cambia su estado y su posición en una sola mutación; el servidor dispara las automatizaciones (por ejemplo, «Listo» → aviso y webhook).</li>
<li>El orden dentro del carril usa índices fraccionales: mover una tarjeta no reescribe las demás.</li>
<li>Alternativa sin ratón: menú «Mover a…» y teclas, para accesibilidad y pantallas táctiles.</li>
</ul>
<pre><code><span class="k">function</span> onDragEnd({ active, over }: DragEndEvent) {
  <span class="k">if</span> (!over) <span class="k">return</span>;
  <span class="k">const</span> item = items[active.id <span class="k">as</span> string];
  <span class="k">const</span> lane = over.data.current!.lane <span class="k">as</span> StatusKey;
  <span class="k">const</span> index = over.data.current!.index <span class="k">as</span> number;
  <span class="k">const</span> order = between(lanes[lane][index - 1]?.sort_order, lanes[lane][index]?.sort_order);
  mutate.updateItem(item.id, {                   <span class="c">// optimista; se revierte si falla</span>
    column_values: { status: { label: lane } },
    sort_order: order,
  });
}</code></pre>

<h3>Línea de tiempo (Gantt)</h3>
<ul>
<li>Cada barra va de la fecha de inicio a la fecha límite; su relleno es el porcentaje de avance y su color, el semáforo.</li>
<li>Escalas por día, semana o mes; línea vertical de hoy; fines de semana sombreados.</li>
<li>Arrastrar la barra mueve ambas fechas; arrastrar su borde derecho cambia solo la fecha límite. Los píxeles se convierten a días enteros.</li>
<li>Dependencias opcionales (columna de dependencia) dibujadas como flechas SVG; las filas se virtualizan.</li>
</ul>
<pre><code><span class="k">const</span> DAY = 86_400_000;
<span class="c">// Fechas ISO sin hora: Date.parse las lee en UTC, así el horario de verano no mueve las barras.</span>
<span class="k">const</span> x = (iso: string) =&gt; ((Date.parse(iso) - Date.parse(range.start)) / DAY) * pxPerDay;
<span class="k">const</span> bar = (it: Item) =&gt; ({ left: x(it.start), width: (diffDays(it.due, it.start) + 1) * pxPerDay });
<span class="k">const</span> dragToDays = (dx: number) =&gt; Math.round(dx / pxPerDay);</code></pre>

<h3>Estructura de la interfaz</h3>
<p>Un menú lateral oscuro con íconos (en el teléfono, una barra inferior) lleva a cada apartado; al pasar el cursor sobre un ícono aparece su nombre. El contenido se organiza en tarjetas grandes sobre fondo gris claro, una idea por tarjeta, para que cualquier integrante entienda la pantalla sin capacitación.</p>
<table>
<tr><th>Apartado</th><th>Para qué sirve</th></tr>
<tr><td>Inicio</td><td>Resumen del día: saludo con lo pendiente, equipo, semáforo en barras, avance, estadísticas de la semana y del mes, lo próximo por vencer, calendario semanal con vencimientos y avisos. Para la Vocalía, atención inmediata y bandeja de revisión; para cada colaborador, sus tareas con los botones para registrar avance.</td></tr>
<tr><td>Mi espacio</td><td>Perfil de cada persona: estado general, indicadores, sus tareas, vencimientos de la semana, actividad reciente y compañeros de área. El del Vocal muestra lo que asignó y lo que espera su revisión.</td></tr>
<tr><td>Tablero de tareas</td><td>Todas las tareas en Tabla, Kanban o Línea de tiempo, con filtros por persona, periodicidad, semáforo y estado.</td></tr>
<tr><td>Equipo y permisos</td><td>Personas (tarjetas y carga de trabajo), Organigrama, Permisos y Directorio.</td></tr>
<tr><td>Evidencias</td><td>Los enlaces a los entregables de cada tarea, con filtros y colecciones por área, y la cobertura de evidencias.</td></tr>
<tr><td>Trabajo en equipo</td><td>Estado de la conexión con la carpeta de OneDrive, computadoras del equipo, pasos para conectarse e intercambio manual.</td></tr>
<tr><td>Comunicaciones · Automatizaciones · Auditoría · Configuración</td><td>Oficios con folio, reglas automáticas, bitácora verificable y ajustes; cada uno visible según los permisos de la cuenta.</td></tr>
</table>

<h3>Identidad institucional en Tailwind</h3>
<p>El gris es el color predominante de la identidad del Instituto; los únicos colores fuera de la paleta son los del semáforo, porque su lectura inmediata depende de ellos. Regla de lectura: el <b>estado</b> del trabajo se muestra en grises (lo cambia el responsable) y el <b>semáforo</b> en bloques de color sólido (se calcula solo); así nunca compiten. Los mismos colores se usan en tablas, tarjetas y gráficas, con texto blanco o tinta oscura que cumple contraste AA.</p>
<pre><code><span class="c">// tailwind.config.js</span>
<span class="k">export default</span> {
  content: ['./src/**/*.{ts,tsx}'],
  theme: {
    extend: {
      colors: {
        ine: { oxford: '#54585A', ink: '#1E1F24', coal: '#2A2C30', steel: '#7D8187',
               silver: '#C4C8CE', mist: '#EEF0F2', fondo: '#ECEDF0', paper: '#F5F6F7' },
        semaforo: { verde: '#12844A', ambar: '#F5B82E', rojo: '#D6363F', vencida: '#8E1B1B', concluida: '#54585A' },
      },
      fontFamily: { sans: ['"Public Sans"', 'system-ui', 'sans-serif'] },
    },
  },
};</code></pre>
<h3>Accesibilidad</h3>
<ul>
<li>El semáforo nunca depende solo del color: siempre lleva texto («Por vencer», «Vencida») y los estados llevan ícono.</li>
<li>Contraste mínimo AA en texto; foco visible; todos los controles operables con teclado.</li>
<li>Diseño adaptable: en el teléfono el menú lateral se convierte en una barra inferior, las tarjetas se apilan en una columna, la tabla se desplaza horizontalmente y el organigrama se apila.</li>
</ul>

<section data-sec="seguridad" data-title="Seguridad y despliegue">
<h2>Seguridad, despliegue y hoja de ruta</h2>
<h3>Cómo funciona este archivo</h3>
<ul>
<li><b>Consulta libre:</b> cualquiera que abra el archivo ve el Inicio, el espacio de cada persona, el tablero, el organigrama, las evidencias y esta documentación.</li>
<li><b>Edición con contraseña:</b> el Vocal, el Asistente y cada colaborador tienen su propia cuenta. El archivo guarda solo la huella de cada contraseña (SHA-256 con sal y 1,500 iteraciones), nunca la contraseña. Tras 5 intentos fallidos la entrada se bloquea un minuto, y la edición se cierra sola tras 20 minutos sin actividad.</li>
<li><b>Permisos:</b> el Vocal activa o retira uno por uno los permisos del Asistente y los de los colaboradores en «Equipo y permisos»; los de los colaboradores aplican solo a sus propias tareas. Cada cambio queda en la auditoría.</li>
<li><b>Tareas de equipo:</b> cuando todos deben hacer lo mismo, el Vocal asigna la tarea una sola vez y cada persona recibe su propia copia, con su estado, avance y semáforo. El tablero las agrupa y muestra el avance conjunto; los cambios de título, fechas o meta pueden aplicarse a todo el equipo.</li>
<li><b>Trabajo en equipo:</b> con la carpeta compartida de OneDrive conectada, cada computadora escribe sus cambios en su propio archivo («WorkOS_cambios_…json») y lee los de las demás cada 15 segundos. Por cada dato gana el cambio más reciente; si dos personas cambian datos distintos de una tarea, se conservan ambos. Como nadie escribe el archivo de otro, OneDrive no genera conflictos de versión.</li>
<li><b>Guardado:</b> los cambios se conservan en el navegador de cada computadora y viajan por la carpeta compartida. «Guardar versión» descarga un archivo HTML nuevo con todos los datos dentro: la versión maestra para archivo de la Vocalía y una versión de consulta, sin bitácoras.</li>
<li><b>Integridad:</b> cada computadora lleva su propia cadena de auditoría encadenada con SHA-256 y cada oficio guarda la huella de su texto; «Verificar integridad» revisa todas las cadenas y detecta cualquier alteración posterior.</li>
</ul>
<div class="callout"><b>Límite de un archivo HTML:</b> la contraseña y los permisos controlan la edición desde la interfaz, pero el código de cualquier HTML y los archivos de la carpeta compartida pueden abrirse con un editor de texto. Por eso la carpeta debe compartirse solo con el personal de la Vocalía. Para un control de acceso estricto, el sistema debe operar en servidor, como se describe abajo.</div>

<h3>Despliegue en servidor</h3>
<ul>
<li><b>Identidad:</b> inicio de sesión único con la cuenta institucional; altas y bajas desde el directorio.</li>
<li><b>Autorización:</b> roles y permisos delegados validados en la API en cada petición, y seguridad por fila en PostgreSQL como segunda barrera.</li>
<li><b>Infraestructura:</b> en la red institucional o en la nube autorizada; cifrado en tránsito (TLS) y en reposo; respaldos diarios con prueba de restauración.</li>
<li><b>Datos personales:</b> minimización, plazos de conservación y protección en el AI Gateway, conforme a la normativa aplicable.</li>
</ul>

<h3>Hoja de ruta</h3>
<table>
<tr><th>Fase</th><th>Alcance</th><th>Resultado</th></tr>
<tr><td>0 · Este archivo</td><td>Organigrama, cuentas por persona, tablero con semáforo, tres vistas, tareas de equipo, oficios con folio, automatizaciones, auditoría y trabajo en equipo por carpeta de OneDrive</td><td>Operar el seguimiento con todo el equipo sin instalar nada.</td></tr>
<tr><td>1 · Producto mínimo en servidor</td><td>Monolito modular (Node.js + PostgreSQL + Redis), inicio de sesión institucional, tiempo real, cada colaborador actualiza su avance</td><td>Un solo tablero compartido por todo el equipo.</td></tr>
<tr><td>2 · Comunicaciones y automatizaciones</td><td>Correo institucional saliente, acuses digitales, programador de eventos de tiempo, webhooks con reintentos</td><td>Recordatorios automáticos con respaldo documental.</td></tr>

<h3>Uso recomendado del archivo</h3>
<ol>
<li>Se coloca este archivo en la carpeta compartida de OneDrive del Work OS; cada integrante la agrega a «Mis archivos», abre el archivo desde ahí con Edge o Chrome y pulsa «Trabajo en equipo» → «Conectar carpeta» (una vez por computadora).</li>
<li>El Vocal pulsa «Entrar», cambia las contraseñas en «Configuración» y entrega a cada colaborador la suya.</li>
<li>Registra correos del equipo en «Equipo y permisos» y define los permisos del Asistente y de los colaboradores.</li>
<li>Quita las tareas de ejemplo y asigna las tareas reales: a una persona o, si todos deben hacer lo mismo, como tarea de equipo.</li>
<li>Cada colaborador entra con su cuenta, ve «Mis tareas» en el Inicio y en «Mi espacio», registra su avance, agrega el enlace de su evidencia y envía a revisión; la Vocalía aprueba desde la «Bandeja de revisión».</li>
<li>El Inicio señala cada mañana lo que está por vencer o vencido; los recordatorios y apercibimientos se emiten desde «Comunicaciones» con folio, huella y bitácora.</li>
<li>Periódicamente el Vocal usa «Guardar versión» para archivar la versión maestra.</li>
</ol>

  var selPerson = loginRole === 'vocal' ? vocal() : loginRole === 'asistente' ? asistente() : personBy(loginPersonId);
  var roleHint = loginRole === 'vocal' ? 'Acceso total' : loginRole === 'asistente' ? 'Permisos definidos por el Vocal' : selPerson ? selPerson.cargo : '';
  var body = '<p style="margin:0" class="small muted">La consulta es libre. Para modificar el tablero ingrese la contraseña de su cuenta; cada sesión queda en la bitácora de auditoría.</p>' +
    '<div class="seg" style="align-self:flex-start"><button class="' + (loginRole === 'vocal' ? 'on' : '') + '" data-act="loginRole" data-r="vocal">' + ic('key', 'sm') + 'Vocal</button><button class="' + (loginRole === 'asistente' ? 'on' : '') + '" data-act="loginRole" data-r="asistente">' + ic('users', 'sm') + 'Asistente</button><button class="' + (loginRole === 'colaborador' ? 'on' : '') + '" data-act="loginRole" data-r="colaborador">' + ic('user', 'sm') + 'Colaborador</button></div>' +
    (loginRole === 'colaborador' ? '<div class="field" style="margin:-4px 0 0"><label>Cuenta</label><select data-chg="loginPerson">' + colabs.map(function (p) { return opt(p.id, pname(p) + ' · ' + shortCargo(p.cargo), loginPersonId); }).join('') + '</select></div>' : '') +
    '<div class="small"><b>' + esc(pname(selPerson)) + '</b><br><span class="muted">' + esc(roleHint) + '</span></div>' +
    '<div class="field"><label for="pw">Contraseña</label><input type="password" id="pw" autocomplete="current-password" data-enter="doLogin" autofocus' + (wait ? ' disabled' : '') + '></div>' +
    (err || wait ? '<div class="callout" style="margin:0;border-left-color:var(--bad-dot)">' + esc(wait ? 'Demasiados intentos. Espere ' + wait + ' segundos.' : err) + '</div>' : '');
  openModal({ title: 'Entrar con su cuenta', size: 'narrow', body: body, foot: '<span class="spacer"></span><button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" data-act="doLogin"' + (wait ? ' disabled' : '') + '>' + ic('unlock', 'sm') + 'Entrar</button>' });
}
CHG.loginPerson = function (el) { loginPersonId = el.value; loginModal(); };
ACT.loginRole = function (el) { loginRole = el.getAttribute('data-r'); loginModal(); };
ACT.doLogin = function () {
  if (failed.until > Date.now()) return loginModal();
  var inp = $('#pw'); if (!inp) return;
  var passKey = loginRole === 'colaborador' ? loginPersonId : loginRole;
  if (!checkPass(passKey, inp.value)) {
    failed.n++;
    if (failed.n >= 5) { failed.until = Date.now() + 60000; failed.n = 0; }
    return loginModal('Contraseña incorrecta.');
  }
  failed.n = 0;
  session.role = loginRole;
  session.personId = loginRole === 'colaborador' ? loginPersonId : null;
  session.since = nowISO(); lastActivity = Date.now(); ui.notifFilter = null; ui.personaId = null; ui.calScope = null; ui.ntab = null;
  closeModal();
  var label = loginRole === 'colaborador' ? pshort(personBy(loginPersonId)) : roleLabel(loginRole);
  audit('Inicio de sesión de edición', label, 'Acceso con contraseña');
  var n = scanSemaforos();
  commit();
  toast('Edición habilitada · ' + label + (n ? ' · ' + plural(n, 'cambio') + ' de semáforo procesado' + (n === 1 ? '' : 's') : ''), 3600);
};
function lock(auto) {
  if (!session.role) return;
  var label = session.role === 'colaborador' ? pshort(personBy(session.personId)) : roleLabel(session.role);
  audit(auto ? 'Sesión bloqueada por inactividad' : 'Sesión de edición cerrada', label, '');
  commit({ render: false });
  session.role = null; session.personId = null; ui.notifFilter = null; ui.personaId = null; ui.calScope = null; ui.ntab = null; if (ui.tab === 'persona') ui.tab = 'panel'; closeModal(); render();
  toast(auto ? 'La edición se bloqueó por inactividad' : 'Edición bloqueada');
}

/* ---------- Arranque ---------- */
/* Arranque: datos del archivo + cambios guardados en esta computadora + cambios del equipo ya recibidos. */
function boot() {
  BASE = migrate(EMBED.seed ? buildSeed(EMBED) : EMBED);
  savedRev = BASE.rev || 0;
  Sync.init().catch(function (e) { storageOK = false; if (!state) state = migrate(BASE); }).then(function () {
    if (!state) state = migrate(BASE);
    if (!state.audit.length) audit('Primer uso del tablero en esta computadora', state.org.tablero, 'Estructura base: Vocal, Asistente, 2 Validadores/as de captura, 3 Técnicos/as en Capacitación Electoral y 1 Técnico/a de Voz y Datos', 'Sistema', 'Sistema');
    render();
    setInterval(function () { if (session.role && Date.now() - lastActivity > AUTOLOCK_MIN * 60000) lock(true); }, 30000);
    setInterval(function () { if (session.role && !modalOpen() && !kbDrag && !gDrag) { if (scanSemaforos()) commit(); else renderChrome(); } }, 300000);
    setInterval(function () { if (!modalOpen()) Sync.renderButton(); }, 20000);
    Sync.resume();
  });
}
boot();
})();

</script>
