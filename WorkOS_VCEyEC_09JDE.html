<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Work OS de la Vocalía de Capacitación Electoral y Educación Cívica de la 09 Junta Distrital Ejecutiva en Baja California. Documentación técnica y prototipo funcional.">
<title>Work OS · Vocalía de Capacitación Electoral · 09 JDE</title>
<style>
:root{
  --oxford:#54585A; --oxford-d:#45494B; --oxford-l:#6A6E71;
  --ink:#1E1F24; --coal:#2F3135; --coal2:#3B3E43; --steel:#7D8187; --muted:#5D6066;
  --silver:#C4C8CE; --line:#DDE0E4; --line2:#E9EBEE; --mist:#EEF0F2; --paper:#F5F6F7; --white:#FFFFFF;
  --ok:#1F7A3F; --ok-bg:#E5F3EA; --ok-dot:#2E9E57;
  --warn:#9A5B00; --warn-bg:#FDF1D8; --warn-dot:#E0A100;
  --bad:#B42318; --bad-bg:#FBE6E3; --bad-dot:#D92D20;
  --done:#45494B; --done-bg:#ECEEF0; --done-dot:#7D8187;
  /* semáforo en bloques sólidos (mismo color en tablas, tarjetas y gráficas) */
  --sv:#12844A; --sa:#F5B82E; --sa-ink:#2B2100; --sr:#D6363F; --sx:#8E1B1B; --sc:#54585A;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(30,31,36,.05),0 6px 18px rgba(30,31,36,.06);
  --shadow-lg:0 18px 50px rgba(30,31,36,.22);
  --font:"Public Sans","Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--oxford-d)}
img{max-width:100%}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.i.sm{width:15px;height:15px}
svg.i.lg{width:22px;height:22px}

/* ---------- contenido ---------- */
main{max-width:1480px;margin:0 auto;padding:18px 22px 60px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin:2px 0 14px}
.crumbs span.sep{color:var(--silver)}
.crumbs b{color:var(--ink);font-weight:600}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.page-head h1{font-size:22px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.2px}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:820px}
.banner{max-width:1480px;margin:12px auto 0;padding:0 22px}
.banner-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-left:4px solid var(--oxford);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px}
.banner-in .grow{flex:1;min-width:220px}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h2,.card h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .sub{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.mono{font-family:var(--mono)}
.nowrap{white-space:nowrap}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--silver);border-radius:var(--radius-sm);background:var(--paper)}
hr.sep{border:0;border-top:1px solid var(--line2);margin:14px 0}

/* ---------- botones y controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;border:1px solid var(--line);background:var(--white);color:var(--ink);padding:8px 13px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--silver);background:var(--paper)}
.btn.primary{background:var(--oxford);border-color:var(--oxford);color:var(--white)}
.btn.primary:hover{background:var(--oxford-d)}
.btn.dark{background:var(--coal);border-color:var(--coal);color:var(--white)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--mist)}
.btn.danger{color:var(--bad);border-color:#F1C4BE}
.btn.danger:hover{background:var(--bad-bg)}
.btn.warn{color:var(--warn);border-color:#EDD39B}
.btn.warn:hover{background:var(--warn-bg)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--mist);color:var(--ink)}
.seg{display:inline-flex;background:var(--mist);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=url],input[type=search],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--white);outline:none;font-size:13.5px}
input:focus,select:focus,textarea:focus{border-color:var(--oxford);box-shadow:0 0 0 3px rgba(84,88,90,.16)}
input[disabled],select[disabled],textarea[disabled]{background:var(--paper);color:var(--muted)}
textarea{resize:vertical;min-height:70px;line-height:1.45}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.2px}
.field .hint{font-size:11.5px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.fgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.switch{position:relative;display:inline-block;width:40px;height:23px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--silver);border-radius:999px;transition:.15s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--oxford)}
.switch input:checked+span::before{transform:translateX(17px)}
.switch input:disabled+span{opacity:.55;cursor:not-allowed}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{width:auto;min-width:150px;padding:7px 9px;font-size:13px}
.filters input[type=search]{min-width:210px}

/* ---------- chips, estados y semáforo ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--mist);color:var(--muted);white-space:nowrap}
.chip.dark{background:var(--coal);color:#fff}
.chip.line{background:transparent;border:1px solid var(--line)}
/* Estado del trabajo: escala de grises institucional (lo cambia el responsable) */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px 4px 8px;border-radius:6px;white-space:nowrap;border:1.5px solid transparent;cursor:default;min-width:118px;line-height:1.3}
button.status{cursor:pointer}
button.status:hover{filter:brightness(.96)}
.status svg{width:14px;height:14px}
.st-sin{background:var(--white);border:1.5px dashed var(--silver);color:var(--muted)}
.st-proceso{background:#D5D8DC;color:var(--ink)}
.st-revision{background:var(--white);border-color:var(--oxford);color:var(--oxford-d)}
.st-detenida{background:repeating-linear-gradient(135deg,#2F3135 0 7px,#3E4146 7px 14px);color:#fff}
.st-listo{background:var(--oxford);color:#fff}
/* Semáforo: color sólido (se calcula solo con la fecha límite) */
.sem{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px 4px 8px;border-radius:6px;white-space:nowrap;color:#fff;line-height:1.3}
.sem i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:rgba(255,255,255,.92)}
.sem-verde{background:var(--sv)}
.sem-amarillo{background:var(--sa);color:var(--sa-ink)} .sem-amarillo i{background:var(--sa-ink)}
.sem-rojo{background:var(--sr)}
.sem-vencida{background:var(--sx)} .sem-vencida i{animation:pulse 1.6s infinite}
.sem-concluida{background:var(--sc)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.verde{background:var(--sv)} .dot.amarillo{background:var(--sa)} .dot.rojo{background:var(--sr)} .dot.vencida{background:var(--sx)} .dot.concluida{background:var(--sc)}
/* bloques que llenan la celda (estilo tablero) */
.blk{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-width:128px;height:38px;border:0;border-radius:6px;font:inherit;font-size:12.5px;font-weight:700;white-space:nowrap;padding:0 10px;cursor:default;color:#fff;position:relative;line-height:1.15;text-align:center}
.blk small{font-weight:600;font-size:11px;opacity:.92;display:block}
.blk .bt{display:flex;flex-direction:column;align-items:center}
.blk svg{width:15px;height:15px}
button.blk{cursor:pointer}
button.blk:hover{filter:brightness(1.07)}
button.blk::after{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 9px 9px 0;border-color:transparent rgba(255,255,255,.55) transparent transparent;border-top-right-radius:6px}
.blk.sk-verde{background:var(--sv)} .blk.sk-amarillo{background:var(--sa);color:var(--sa-ink)} .blk.sk-rojo{background:var(--sr)} .blk.sk-vencida{background:var(--sx)} .blk.sk-concluida{background:var(--sc)}
.blk.ek-sin{background:var(--white);border:1.5px dashed var(--silver);color:var(--muted)}
.blk.ek-proceso{background:#D5D8DC;color:var(--ink)}
.blk.ek-revision{background:var(--white);box-shadow:inset 0 0 0 2px var(--oxford);color:var(--oxford-d)}
.blk.ek-detenida{background:repeating-linear-gradient(135deg,#2F3135 0 7px,#3E4146 7px 14px)}
.blk.ek-listo{background:var(--oxford)}
.blk.ek-sin::after,.blk.ek-proceso::after,.blk.ek-revision::after{border-color:transparent rgba(84,88,90,.35) transparent transparent}
.blk.sk-amarillo::after{border-color:transparent rgba(43,33,0,.25) transparent transparent}
.prio{font-size:11.5px;font-weight:700;color:var(--muted)}
.prio.Alta{color:var(--ink)}
.prio.Alta::before{content:"▲ ";font-size:9px}
.prio.Media::before{content:"● ";font-size:8px;color:var(--steel)}
.prio.Baja::before{content:"▼ ";font-size:9px;color:var(--silver)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--coal2);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none;letter-spacing:.3px}
.avatar.lg{width:42px;height:42px;font-size:14px}
.avatar.vacante{background:var(--white);color:var(--steel);border:1.5px dashed var(--silver)}

.person{display:inline-flex;align-items:center;gap:8px;min-width:0}
.person .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.progress{height:8px;background:var(--mist);border-radius:999px;overflow:hidden;min-width:70px}
.progress>span{display:block;height:100%;background:var(--oxford);border-radius:999px}
.progress.thin{height:5px}
.pct{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 6px}

/* ---------- panel ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{position:relative;cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:6px;padding:14px 14px 12px;text-align:left;font:inherit;color:inherit;overflow:hidden}
.kpi:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(30,31,36,.12)}
.kpi:focus-visible{outline:3px solid rgba(84,88,90,.35);outline-offset:2px}
.kpi .kh{display:flex;align-items:center;gap:9px}
.kpi .kic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--oxford);flex:none}
.kpi .kic svg{width:19px;height:19px}
.kpi .t{font-weight:700;font-size:13px;line-height:1.2}
.kpi .n{font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;margin:4px 0 0}
.kpi .n small{font-size:14px;font-weight:700;color:var(--muted);margin-left:4px}
.kpi .d{font-size:11.5px;color:var(--muted);line-height:1.35}
.kpi .kbar{height:5px;border-radius:3px;background:var(--mist);overflow:hidden;margin-top:auto}
.kpi .kbar span{display:block;height:100%;border-radius:3px}
.kpi.verde .kic,.kpi.verde .kbar span{background:var(--sv)} .kpi.amarillo .kic,.kpi.amarillo .kbar span{background:var(--sa)} .kpi.amarillo .kic{color:var(--sa-ink)}
.kpi.rojo .kic,.kpi.rojo .kbar span{background:var(--sr)} .kpi.vencida .kic,.kpi.vencida .kbar span{background:var(--sx)} .kpi.concluida .kic,.kpi.concluida .kbar span{background:var(--sc)}
.kpi.total .kic{background:var(--coal)} .kpi.total .kbar span{background:var(--coal)}
.alist{display:flex;flex-direction:column}
.aitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line2)}
.aitem:last-child{border-bottom:0}
.aitem .tt{font-weight:600;cursor:pointer}
.aitem .tt:hover{text-decoration:underline}
.aitem .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.prow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line2)}
.prow:last-child{border-bottom:0}
.prow .dots{display:flex;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.prow .dots span{display:inline-flex;align-items:center;gap:4px}
.period{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--oxford) calc(var(--p)*1%),var(--mist) 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring b{width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}

/* ---------- tablero: tabla ---------- */
.board-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.group{margin-bottom:18px}
.group-head{display:flex;align-items:center;gap:10px;margin:0 0 8px;padding-left:2px}
.group-head .gname{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.group-head .gbar{width:5px;height:20px;border-radius:3px;background:var(--oxford)}
.group-head .gbar.g-men{background:var(--coal)}
.tblwrap{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--paper);text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.2px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl th .fx{font-family:var(--mono);font-size:10px;background:var(--mist);border-radius:4px;padding:0 4px;margin-left:4px;color:var(--coal2)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FAFBFB}
.tbl td.title-cell{min-width:260px;max-width:380px}
.tbl .ttl{font-weight:600;cursor:pointer;display:inline}
.tbl .ttl:hover{text-decoration:underline}
.tbl .sub-row td{background:var(--paper);font-size:12.5px}
.tbl .sub-row td.title-cell{padding-left:44px}
.tbl tr.row-sem-vencida td:first-child{box-shadow:inset 5px 0 0 var(--sx)}
.tbl tr.row-sem-rojo td:first-child{box-shadow:inset 5px 0 0 var(--sr)}
.tbl tr.row-sem-amarillo td:first-child{box-shadow:inset 5px 0 0 var(--sa)}
.tbl tr.row-sem-verde td:first-child{box-shadow:inset 5px 0 0 var(--sv)}
.tbl tr.row-sem-concluida td:first-child{box-shadow:inset 5px 0 0 var(--sc)}
.tbl td.cb{padding:3px 2px;width:1%}
.tbl tr.member td{background:#FBFBFC}
.tbl tr.member td.title-cell{padding-left:34px;position:relative}
.tbl tr.member td.title-cell::before{content:"";position:absolute;left:18px;top:0;bottom:50%;width:10px;border-left:2px solid var(--silver);border-bottom:2px solid var(--silver);border-bottom-left-radius:6px}
.tbl tr.team-row td{background:#F6F7F8;border-bottom-color:var(--line)}
.tbl tr.team-row .ttl{font-weight:700}
.teamtag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--oxford-d);background:var(--white);border:1px solid var(--silver);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap;vertical-align:middle}
.teamtag svg{width:13px;height:13px}
.mbar{display:flex;gap:3px;align-items:center;justify-content:center;min-width:128px;height:38px;border-radius:6px;background:var(--white);border:1px solid var(--line);padding:0 6px;cursor:pointer}
.mbar span{flex:1;max-width:18px;height:22px;border-radius:4px}
.gsum{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--mist);width:200px;flex:none}
.gsum span{display:block;height:100%}
.gsum span+span{box-shadow:inset 1px 0 0 rgba(255,255,255,.7)}
.tbl .addrow td{padding:6px 10px}
.expander{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 4px 0 0;display:inline-flex;align-items:center;vertical-align:middle}
.subcount{font-size:11px;color:var(--muted);font-weight:700;margin-left:6px;white-space:nowrap}
.days{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.days.neg{color:var(--bad)}
.menu{position:fixed;z-index:80;background:var(--white);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;min-width:190px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:6px;border-radius:7px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--mist)}

/* ---------- tablero: kanban ---------- */
.kb{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.kb-col{background:var(--mist);border-radius:var(--radius);padding:10px;min-height:220px;border:2px solid transparent;transition:border-color .12s,background .12s}
.kb-col.over{border-color:var(--oxford);background:#E4E6E9}
.kb-col-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.kb-col-head .status{min-width:0}
.kb-col-head .n{margin-left:auto;font-size:12px;font-weight:800;color:var(--muted)}
.kb-cards{display:flex;flex-direction:column;gap:8px;min-height:40px}
.kb-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.04);position:relative;cursor:pointer;border-top:5px solid var(--silver)}
.kb-card:hover{box-shadow:0 6px 16px rgba(30,31,36,.1)}
.kb-card.s-verde{border-top-color:var(--sv)} .kb-card.s-amarillo{border-top-color:var(--sa)} .kb-card.s-rojo{border-top-color:var(--sr)} .kb-card.s-vencida{border-top-color:var(--sx)} .kb-card.s-concluida{border-top-color:var(--sc)}
.kb-col-head .status{flex:1;justify-content:center;padding:7px 10px}
.kb-flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
.kb-flow .status{min-width:0;padding:3px 8px}
.kb-card .kt{font-weight:700;font-size:13px;margin-bottom:6px;padding-right:22px}
.kb-card .km{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.kb-card .kf{display:flex;align-items:center;gap:8px;margin-top:8px}
.kb-handle{position:absolute;top:8px;right:6px;width:22px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--steel);cursor:grab;touch-action:none;border-radius:6px}
.kb-handle:hover{background:var(--mist)}
.kb-ghost{position:fixed;z-index:90;pointer-events:none;opacity:.92;transform:rotate(2deg);box-shadow:var(--shadow-lg)}
.kb-card.dragging{opacity:.35}

/* ---------- tablero: gantt ---------- */
.gantt{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:grid;grid-template-columns:260px minmax(0,1fr);overflow:hidden}
.g-left{border-right:1px solid var(--line);background:var(--white);z-index:2}
.g-right{overflow-x:auto;position:relative}
.g-head-l{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;padding:0 12px 8px;font-size:11.5px;font-weight:700;color:var(--muted)}
.g-lrow{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line2);font-size:12.5px;white-space:nowrap;overflow:hidden}
.g-lrow .gt{overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:600}
.g-lrow.grp,.g-row.grp{height:32px;background:var(--paper);font-weight:800;font-size:12px;color:var(--coal2)}
.g-scale{position:relative;height:56px;border-bottom:1px solid var(--line)}
.g-month{position:absolute;top:0;height:24px;font-size:11.5px;font-weight:800;color:var(--coal2);padding:5px 0;border-left:1px solid var(--line);white-space:nowrap}
.g-month span{position:sticky;left:8px;padding:0 8px;background:var(--white)}
.g-day{position:absolute;top:24px;height:32px;font-size:10.5px;color:var(--muted);text-align:center;border-left:1px solid var(--line2);padding-top:4px;line-height:1.1}
.g-day.we{background:var(--paper)}
.g-day.today{color:var(--ink);font-weight:800}
.g-body{position:relative}
.g-row{position:relative;height:40px;border-bottom:1px solid var(--line2)}
.g-wk{position:absolute;top:0;bottom:0;background:rgba(238,240,242,.65)}
.g-todayline{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);z-index:3;pointer-events:none}
.g-todayline::before{content:"Hoy";position:absolute;top:-1px;left:4px;font-size:10px;font-weight:800;background:var(--ink);color:#fff;padding:1px 5px;border-radius:4px}
.g-bar{position:absolute;top:8px;height:24px;border-radius:7px;background:var(--silver);overflow:hidden;cursor:pointer;display:flex;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.12);z-index:2;touch-action:none}
.g-bar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.22)}
.g-bar .lab{position:relative;font-size:11px;font-weight:700;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.g-bar.s-verde{background:var(--sv)} .g-bar.s-amarillo{background:var(--sa)} .g-bar.s-amarillo .lab{color:var(--sa-ink)} .g-bar.s-amarillo .fill{background:rgba(43,33,0,.16)} .g-bar.s-rojo{background:var(--sr)} .g-bar.s-vencida{background:var(--sx)} .g-bar.s-concluida{background:var(--sc)}
.g-bar .rz{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:ew-resize;background:rgba(30,31,36,.12)}
.g-bar.editable{cursor:grab}
.g-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px;align-items:center}

/* ---------- organigrama ---------- */
.org{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;overflow-x:auto}
.onode{background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:10px;align-items:center;min-width:250px;max-width:330px;position:relative}
.onode.head{border:2px solid var(--oxford);min-width:330px}
.onode .on-name{font-weight:800;font-size:13.5px;line-height:1.25}
.onode .on-role{font-size:12px;color:var(--muted);line-height:1.3}
.onode .on-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.org-trunk{width:2px;background:var(--silver);height:26px}
.org-staffrow{display:flex;align-items:center;position:relative;width:100%;justify-content:center}
.org-staffrow .org-trunk{height:128px}
.org-staff{position:absolute;left:calc(50% + 1px);top:50%;transform:translateY(-50%);display:flex;align-items:center}
.org-staff .hline{width:40px;border-top:2px dashed var(--silver);flex:none}
.onode.staff{border-style:dashed;border-color:var(--steel)}
.org-branches{display:flex;gap:18px;position:relative;padding-top:26px;align-items:flex-start}
.org-branches::before{content:"";position:absolute;top:0;left:var(--l,0);right:var(--r,0);border-top:2px solid var(--silver)}
.obranch{display:flex;flex-direction:column;align-items:center;position:relative}
.obranch::before{content:"";position:absolute;top:-26px;left:50%;height:26px;border-left:2px solid var(--silver)}
.oarea{background:var(--coal);color:#fff;border-radius:10px;padding:8px 14px;font-weight:800;font-size:12.5px;text-align:center;min-width:220px}
.oarea small{display:block;font-weight:600;color:#D3D6DB;font-size:11px}
.omembers{display:flex;flex-direction:column;gap:8px;margin-top:10px;width:100%}
.omembers .onode{min-width:0;max-width:none;width:100%}
.mini-sem{display:inline-flex;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}
.mini-sem span{display:inline-flex;align-items:center;gap:3px}
.perm-table td,.perm-table th{text-align:center}
.perm-table td:first-child,.perm-table th:first-child{text-align:left}

/* ---------- comunicaciones y oficio ---------- */
.comms{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:16px;align-items:start}
.oficio{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:42px 52px;color:#111;font-size:13.5px;line-height:1.6;max-width:820px;margin:0 auto}
.of-head{display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--oxford);padding-bottom:12px;margin-bottom:18px}
.of-head img{height:46px;width:auto}
.of-head .of-inst{font-size:12px;line-height:1.35;color:var(--coal)}
.of-head .of-inst b{font-size:12.5px;color:var(--ink)}
.of-ref{text-align:right;font-size:12.5px;margin-bottom:16px;line-height:1.5}
.of-ref b{font-weight:700}
.of-body p{margin:0 0 12px;text-align:justify}
.of-dest{margin-bottom:16px;font-weight:700;line-height:1.35}
.of-dest .pres{letter-spacing:2px}
.of-firma{margin-top:34px;text-align:center;line-height:1.35}
.of-firma .lin{width:280px;border-top:1px solid #333;margin:46px auto 6px}
.of-ccp{margin-top:24px;font-size:11px;color:#333}
.of-acuse{margin-top:26px;border:1px dashed #888;border-radius:6px;padding:10px 12px;font-size:11.5px}
.of-acuse .lines{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.of-acuse .lines div{border-top:1px solid #555;padding-top:4px;text-align:center}
.of-fp{margin-top:12px;font-family:var(--mono);font-size:10px;color:#666;word-break:break-all}
.tag-tipo{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px}
.tag-tipo.recordatorio{background:var(--mist);color:var(--coal)}
.tag-tipo.apercibimiento{background:var(--coal);color:#fff}
.varlist{display:flex;flex-wrap:wrap;gap:5px}
.varlist code{font-family:var(--mono);font-size:11px;background:var(--mist);border-radius:5px;padding:2px 6px;cursor:pointer}

/* ---------- automatizaciones, IA y auditoría ---------- */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .fbox{flex:1;min-width:170px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.flow .fbox .k{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--steel);text-transform:uppercase}
.flow .fbox .v{font-weight:700;margin-top:3px}
.flow .farrow{display:flex;align-items:center;padding:0 8px;color:var(--steel)}
.rule{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.rule .sentence{line-height:1.9}
.rule .tok{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:1px 8px;font-weight:700;font-size:12.5px;margin:0 2px;white-space:nowrap}
.tok.trg{background:var(--coal);color:#fff}
.tok.cnd{background:var(--mist);color:var(--coal);border:1px solid var(--line)}
.tok.act{background:var(--white);color:var(--ink);border:1.5px solid var(--oxford)}

.log{font-family:var(--mono);font-size:11.5px}
.hashc{font-family:var(--mono);font-size:11px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok-dot);animation:pulse 1.4s infinite}
.integrity{display:inline-flex;align-items:center;gap:6px;font-weight:700;border-radius:8px;padding:6px 10px;font-size:12.5px}
.integrity.ok{background:var(--ok-bg);color:var(--ok)}
.integrity.bad{background:var(--bad-bg);color:var(--bad)}

/* ---------- modal, menú y avisos ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(30,31,36,.48);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto}
.modal{background:var(--white);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:760px;display:flex;flex-direction:column;max-height:none}
.modal.wide{max-width:980px}
.modal.narrow{max-width:440px}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:17px;font-weight:800;flex:1;min-width:0}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--paper);border-radius:0 0 14px 14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--coal);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.drawer-list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.notif{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px;border:1px solid var(--line2);border-radius:10px}
.notif.unread{background:var(--paper);border-color:var(--line)}
.subitems{display:flex;flex-direction:column;gap:6px}
.subitems label{display:flex;align-items:center;gap:8px;font-size:13px}
.subitems label.done span{text-decoration:line-through;color:var(--muted)}
.updates{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto}
.upd{background:var(--paper);border-radius:9px;padding:8px 10px;font-size:12.5px}
.upd .uh{font-weight:700;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.calc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.calc div{background:var(--paper);border-radius:9px;padding:8px 10px}
.calc div .lbl{display:block}
.calc div b{font-size:15px}

/* ---------- documentación ---------- */
.doc{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
.doc-nav{position:sticky;top:64px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:2px}
.doc-nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px}
.doc-nav a:hover{background:var(--mist);color:var(--ink)}
.doc-nav a.on{background:var(--oxford);color:#fff}
.doc-nav .dn-h{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--steel);text-transform:uppercase;padding:8px 10px 4px}
.doc-body{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:28px 34px;box-shadow:var(--shadow);min-width:0}
.doc-body h2{font-size:22px;margin:0 0 6px;font-weight:800;letter-spacing:-.2px}
.doc-body h3{font-size:16px;margin:26px 0 8px;font-weight:800}
.doc-body h4{font-size:14px;margin:18px 0 6px;font-weight:800;color:var(--coal2)}
.doc-body p,.doc-body li{line-height:1.65;color:#2A2C31}
.doc-body p{margin:0 0 10px}
.doc-body ul,.doc-body ol{padding-left:20px;margin:0 0 12px}
.doc-body .lead{font-size:15px;color:var(--muted);margin-bottom:16px}
.doc-body code{font-family:var(--mono);font-size:12px;background:var(--mist);border-radius:5px;padding:1px 5px}
.doc-body pre{background:#1F2024;color:#E8EAED;border-radius:10px;padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.55;margin:8px 0 16px;border:1px solid #2C2E33}
.doc-body pre code{background:none;padding:0;color:inherit;font-size:inherit}
.doc-body pre .c{color:#8F949C}
.doc-body pre .k{color:#FFFFFF;font-weight:700}
.doc-body pre .s{color:#C9CDD3}
.doc-body table{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:12.8px}
.doc-body th,.doc-body td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.doc-body th{background:var(--paper);font-size:12px}
.callout{border:1px solid var(--line);border-left:4px solid var(--oxford);background:var(--paper);border-radius:8px;padding:10px 14px;margin:10px 0 16px;font-size:13px}
.callout b{color:var(--ink)}
.diagram{border:1px solid var(--line);border-radius:10px;padding:12px;background:#FCFCFD;margin:8px 0 16px;overflow-x:auto}
.diagram svg{display:block;max-width:100%;height:auto;margin:0 auto}
.nest{border:1.5px solid var(--oxford);border-radius:10px;padding:8px 10px 10px;margin-top:8px;background:#fff}
.nest .nl{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--steel)}
.nest .nv{font-weight:700;font-size:13px;margin-bottom:2px}
.nest .nest{border-color:var(--silver)}

/* ---------- gráficas del panel ---------- */
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lg{border:0;border-radius:10px;padding:10px 12px;color:#fff;cursor:pointer;text-align:left;font:inherit;display:flex;flex-direction:column;gap:2px;min-width:0}
.lg .lt{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px}
.lg .lt b{margin-left:auto;font-size:18px;font-variant-numeric:tabular-nums}
.lg .lr{font-size:11.5px;opacity:.95;line-height:1.35}
.lg.sk-verde{background:var(--sv)} .lg.sk-amarillo{background:var(--sa);color:var(--sa-ink)} .lg.sk-rojo{background:var(--sr)} .lg.sk-vencida{background:var(--sx)} .lg.sk-concluida{background:var(--sc)}
.lg:hover{filter:brightness(1.06)}
.legend-note{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:8px 2px 0;flex-wrap:wrap}
.legend-note .status{min-width:0;padding:2px 7px;font-size:11px}
.chart-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:200px;height:200px;flex:none;display:block}
.donut .trk{fill:none;stroke:var(--mist);stroke-width:30}
.donut .dseg{fill:none;stroke-width:30;cursor:pointer;transition:stroke-width .15s,opacity .15s}
.donut .dseg:hover{stroke-width:36}
.donut .k-verde{stroke:var(--sv)} .donut .k-amarillo{stroke:var(--sa)} .donut .k-rojo{stroke:var(--sr)} .donut .k-vencida{stroke:var(--sx)} .donut .k-concluida{stroke:var(--sc)}
.donut .dn{font-size:38px;font-weight:800;fill:var(--ink);font-family:var(--font)}
.donut .dl{font-size:12.5px;font-weight:600;fill:var(--muted);font-family:var(--font)}
.dlegend{display:flex;flex-direction:column;gap:6px;min-width:190px;flex:1}
.dli{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;border:0;background:transparent;font:inherit;text-align:left;color:inherit}
.dli:hover{background:var(--paper)}
.dli i{width:14px;height:14px;border-radius:4px}
.dli b{font-variant-numeric:tabular-nums}
.dli span.pc{font-size:12px;color:var(--muted);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.k-verde-bg{background:var(--sv)} .k-amarillo-bg{background:var(--sa)} .k-rojo-bg{background:var(--sr)} .k-vencida-bg{background:var(--sx)} .k-concluida-bg{background:var(--sc)}
.pbar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--mist)}
.pbar span{display:block;height:100%;cursor:pointer}
.pbar span+span{box-shadow:inset 2px 0 0 rgba(255,255,255,.8)}
.cols{display:flex;align-items:stretch;gap:10px;height:250px;padding-top:6px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;cursor:pointer;border-radius:10px;padding:4px 2px 6px;border:0;background:transparent;font:inherit;color:inherit}
.col:hover{background:var(--paper)}
.col .cplot{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;border-bottom:2px solid var(--line)}
.col .cstack{width:72%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden;min-height:2px}
.col .cstack span{display:block;width:100%}
.col .cstack span+span{box-shadow:inset 0 -2px 0 rgba(255,255,255,.75)}
.col .ctot{font-size:12px;font-weight:800;margin-bottom:3px;font-variant-numeric:tabular-nums}
.col .cav{margin-top:7px}
.col .cnm{font-size:11.5px;font-weight:600;color:var(--coal2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.col .cnm small{display:block;color:var(--muted);font-weight:600;font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
.dd.past .dw{font-size:9.5px;letter-spacing:-.2px}
.col.empty-col .cplot{border-bottom-style:dashed}
.d14{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:5px}
.dd{border:1px solid var(--line);border-radius:9px;background:var(--white);padding:6px 3px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:92px;cursor:pointer;font:inherit;color:inherit}
.dd:hover{border-color:var(--silver);background:var(--paper)}
.dd .dw{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase}
.dd .dn{font-size:15px;font-weight:800;line-height:1}
.dd.we{background:var(--paper)}
.dd.today{border:2px solid var(--ink)}
.dd.past{background:#FBEDED;border-color:#EBC5C5}
.dd .pills{display:flex;flex-direction:column;gap:2px;width:100%;padding:0 3px;margin-top:2px}
.dd .pills span{display:block;height:7px;border-radius:3px}
.dd .more{font-size:10px;font-weight:800;color:var(--muted)}
.dd[disabled]{cursor:default}
.hk{transition:opacity .15s}
body[data-hl] .hk{opacity:.16}
body[data-hl="verde"] .hk-verde,body[data-hl="amarillo"] .hk-amarillo,body[data-hl="rojo"] .hk-rojo,body[data-hl="vencida"] .hk-vencida,body[data-hl="concluida"] .hk-concluida{opacity:1}
.tip{position:fixed;z-index:400;background:var(--coal);color:#fff;font-size:12px;line-height:1.45;padding:8px 11px;border-radius:9px;max-width:300px;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .1s}
.tip.show{opacity:1}
.tip b{display:block;font-size:12.5px;margin-bottom:2px}
.infobtn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--white);color:var(--muted);cursor:help;flex:none;padding:0}
.infobtn svg{width:14px;height:14px}
.card h3 .infobtn{margin-left:4px}
.card h3 .sub+.infobtn{margin-left:6px}

/* ---------- tareas de equipo, mis tareas y revisión ---------- */
.astack{display:inline-flex;align-items:center;padding-left:6px}
.astack .avatar{margin-left:-6px;border:2px solid var(--white)}
.astack .more{margin-left:-6px;width:28px;height:28px;border-radius:50%;background:var(--mist);color:var(--coal2);font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--white)}
.avatar.r-verde{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--sv)} .avatar.r-amarillo{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--sa)} .avatar.r-rojo{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--sr)} .avatar.r-vencida{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--sx)} .avatar.r-concluida{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--sc)}
.avwrap{position:relative;display:inline-flex}
.avwrap .ok{position:absolute;right:-4px;bottom:-3px;width:15px;height:15px;border-radius:50%;background:var(--sc);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--white)}
.avwrap .ok svg{width:9px;height:9px;stroke-width:3.2}
.teamlist{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:11px 2px;border-bottom:1px solid var(--line2);align-items:center}
.trow:last-child{border-bottom:0}
.trow .tt{font-weight:700;cursor:pointer}
.trow .tt:hover{text-decoration:underline}
.trow .tm{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.trow .people{display:flex;gap:9px;flex-wrap:wrap;grid-column:1/-1;padding-top:4px}
.trow .tprog{display:flex;align-items:center;gap:8px;min-width:150px}
.trow .tprog .progress{flex:1}
.mytasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mtask{border:1px solid var(--line);border-radius:12px;background:var(--white);padding:12px 13px;display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--silver);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.mtask.s-verde{border-top-color:var(--sv)} .mtask.s-amarillo{border-top-color:var(--sa)} .mtask.s-rojo{border-top-color:var(--sr)} .mtask.s-vencida{border-top-color:var(--sx)} .mtask.s-concluida{border-top-color:var(--sc)}
.mtask .mt{font-weight:700;cursor:pointer;line-height:1.3}
.mtask .mt:hover{text-decoration:underline}
.mtask .mm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--paper);width:30px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.stepper button:hover{background:var(--mist)}
.stepper span{padding:0 10px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.nextstep{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hello{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.hello .avatar{width:44px;height:44px;font-size:14px}
.hello h3{margin:0;font-size:17px}
.welcome{background:linear-gradient(120deg,var(--coal) 0%,var(--oxford) 70%,var(--oxford-l) 100%);color:#fff;border-radius:14px;padding:18px 20px;display:flex;gap:18px;align-items:center;margin-bottom:14px;flex-wrap:wrap;box-shadow:var(--shadow)}
.welcome .wt{font-size:17px;font-weight:800;margin-bottom:4px}
.welcome .ws{font-size:13px;color:#E3E5E8;max-width:760px;line-height:1.5}
.welcome .steps3{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.welcome .steps3 span{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600}
.welcome .steps3 b{width:20px;height:20px;border-radius:50%;background:#fff;color:var(--coal);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.welcome .btn{border-color:#fff}
.tline{position:relative;height:56px;margin:2px 4px 0}
.tline .tr{position:absolute;left:0;right:0;top:22px;height:10px;border-radius:5px;background:var(--mist)}
.tline .fl{position:absolute;left:0;top:22px;height:10px;border-radius:5px}
.tline .ex{position:absolute;top:14px;width:2px;height:26px;background:var(--ink)}
.tline .ex::before{content:attr(data-l);position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;white-space:nowrap;background:var(--ink);color:#fff;padding:0 5px;border-radius:4px}
.tline .ends{position:absolute;left:0;right:0;top:38px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600}
.memberlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto 110px;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line2);border-radius:9px;background:var(--paper)}
.mrow.me{border-color:var(--oxford);background:var(--white)}
.mrow .status,.mrow .sem{min-width:0}
.pick-tools{display:flex;gap:6px;flex-wrap:wrap}
.pickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pick{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 9px;cursor:pointer;background:var(--white);min-width:0}
.pick input{width:16px;height:16px;flex:none;accent-color:var(--oxford)}
.pick .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .cg{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.on{border-color:var(--oxford);box-shadow:inset 0 0 0 1px var(--oxford);background:#F4F5F6}
.assign-note{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.filter-chip{display:inline-flex;align-items:center;gap:6px;background:var(--coal);color:#fff;border-radius:999px;padding:5px 6px 5px 11px;font-size:12px;font-weight:700}
.filter-chip button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.togglebtn.on{background:var(--coal);border-color:var(--coal);color:#fff}

/* ---------- guía interactiva ---------- */
#tourBlock{position:fixed;inset:0;z-index:299}
.tour-hole{position:fixed;z-index:300;border-radius:12px;box-shadow:0 0 0 9999px rgba(20,21,24,.62);pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s}
.tour-hole.center{width:0!important;height:0!important}
.tour-card{position:fixed;z-index:301;background:var(--white);border-radius:14px;box-shadow:var(--shadow-lg);padding:16px 16px 12px;width:min(380px,calc(100vw - 24px))}
.tour-card .tk{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--steel)}
.tour-card h4{margin:4px 0 6px;font-size:16px;font-weight:800}
.tour-card p{margin:0 0 8px;font-size:13.2px;line-height:1.55;color:#2A2C31}
.tour-card .tdots{display:flex;gap:4px;margin-right:auto}
.tour-card .tdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tour-card .tdots i.on{background:var(--oxford)}
.tour-card .tfoot{display:flex;align-items:center;gap:6px;margin-top:6px}

/* ---------- sincronización ---------- */
.top-btn.sync{gap:7px}
.top-btn.sync .sd{width:9px;height:9px;border-radius:50%;background:#9EA3A8;flex:none}
.top-btn.sync.on .sd{background:#6EE7A1;box-shadow:0 0 0 3px rgba(110,231,161,.25)}
.top-btn.sync.wait .sd{background:#FCD34D;animation:pulse 1.4s infinite}
.top-btn.sync.err .sd{background:#FCA5A5}
.top-btn.sync.busy .sd{animation:pulse .8s infinite}
.syncflow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.syncflow .sb{border:1px solid var(--line);border-radius:12px;padding:10px 8px;background:var(--paper);font-size:12px;line-height:1.35}
.syncflow .sb b{display:block;font-size:13px;margin:4px 0 2px}
.syncflow .sb.mid{background:var(--oxford);color:#fff;border-color:var(--oxford)}
.syncflow .sa{color:var(--steel);display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:700}
.dev-list{display:flex;flex-direction:column;gap:6px}
.dev-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line2);border-radius:10px}
.dev-row.mine{border-color:var(--oxford)}
.steps-num{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.steps-num li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;font-size:13px;line-height:1.5}
.steps-num li::before{counter-increment:st;content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--oxford);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}

/* ---------- impresión del oficio ---------- */
#printRoot{display:none}
@media print{
  @page{size:letter;margin:16mm 18mm}
  body.printing>*:not(#printRoot){display:none!important}
  body.printing #printRoot{display:block}
  body.printing #printRoot .oficio{border:0;box-shadow:none;padding:0;max-width:none}
  body{background:#fff}
}

/* ---------- adaptable ---------- */
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .legend{grid-template-columns:repeat(3,minmax(0,1fr))}
  .d14wrap{overflow-x:auto;padding-bottom:4px}
  .d14{min-width:760px}
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .comms{grid-template-columns:minmax(0,1fr)}
  .doc{grid-template-columns:minmax(0,1fr)}
  .doc-nav{position:static;flex-direction:row;flex-wrap:wrap}
  .doc-nav .dn-h{display:none}
}
@media (max-width:760px){
  body{font-size:14px}
  .topbar{flex-wrap:wrap;padding:10px 14px;gap:10px}
  .brand{flex-basis:100%}
  .brand-logo{height:32px}
  .brand-title{font-size:13.5px;white-space:normal;line-height:1.3}
  .brand-sub{white-space:normal;font-size:11.5px}
  .top-actions{flex-basis:100%;justify-content:flex-end}
  .top-btn .lbl-long{display:none}
  main{padding:14px 12px 50px}
  .banner{padding:0 12px}
  .g2,.g3,.g5,.fgrid,.fgrid3{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .crumbs{display:none}
  .kpi .d{font-size:11.5px}
  .kpi .n{font-size:28px}
  .page-head h1{font-size:19px}
  .prow{grid-template-columns:minmax(0,1fr) auto}
  .prow .progress{display:none}
  .gantt{grid-template-columns:150px minmax(0,1fr)}
  .oficio{padding:22px 18px}
  .doc-body{padding:18px 16px}
  .org-staff{position:static;transform:none;margin:0 0 6px}
  .org-staff .hline{display:none}
  .org-staffrow{flex-direction:column}
  .org-staffrow .org-trunk{height:20px}
  .org-branches{flex-direction:column;gap:14px;padding-top:12px;width:100%}
  .org-branches::before,.obranch::before{display:none}
  .obranch{width:100%}
  .onode,.onode.head{min-width:0;max-width:none;width:100%}
  .calc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rule{grid-template-columns:minmax(0,1fr)}
  .filters select,.filters input,.filters input[type=search]{min-width:0;flex:1 1 140px}
  .modal-bg{padding:0}
  .modal{border-radius:0;min-height:100vh}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .n{font-size:26px}
  .legend{grid-template-columns:repeat(2,minmax(0,1fr))}
  .legend .lg:last-child{grid-column:1/-1}
  .chart-row{justify-content:center}
  .donut{width:170px;height:170px}
  .cols{height:210px;gap:4px;overflow-x:auto}
  .col{min-width:44px}
  .gsum{width:110px}
  .syncflow{grid-template-columns:minmax(0,1fr)}
  .syncflow .sa{transform:rotate(90deg)}
  .mrow{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .mrow .progress,.mrow .row:last-child{grid-column:1/-1}
  .pickgrid{grid-template-columns:minmax(0,1fr)}
  .top-btn.sync .lbl-long{display:none}
  .card h3{flex-wrap:wrap}
  .card h3 .sub{flex-basis:100%;order:5;margin-left:26px}
  .welcome{padding:14px}
  .trow{grid-template-columns:minmax(0,1fr)}
}

/* =====================================================================
   DISEÑO 3 · barra lateral, tarjetas grandes y tablero visual
   (colores del Instituto; el color fuerte se reserva para el semáforo)
   ===================================================================== */
:root{
  --bg:#ECEDF0; --card:#FFFFFF; --soft:#F4F5F7; --soft2:#E9EAED; --rim:#E1E3E7; --coal:#2A2C30;
  --r-xl:24px; --r-lg:18px; --r-md:14px;
  --sh:0 1px 2px rgba(18,19,22,.04),0 10px 28px rgba(18,19,22,.06);
  --sh-hover:0 2px 4px rgba(18,19,22,.06),0 18px 38px rgba(18,19,22,.11);
  --sv-soft:#DDF0E5; --sa-soft:#FDF0CC; --sr-soft:#FADFE0; --sx-soft:#F1D6D6; --sc-soft:#E4E6E9;
  --sv-ink:#0B5A30; --sa-ink2:#6B4D00; --sr-ink:#9B1C22; --sx-ink:#7A1515;
}
body{background:var(--bg)}
.app{display:flex;min-height:100vh}
/* barra lateral */
.side{position:fixed;left:14px;top:14px;bottom:14px;width:66px;background:linear-gradient(180deg,#3B3E43 0%,#25272B 100%);border-radius:33px;display:flex;flex-direction:column;align-items:center;padding:14px 0 12px;z-index:60;box-shadow:0 12px 30px rgba(18,19,22,.22)}
.side-logo{width:46px;height:46px;border-radius:16px;background:rgba(255,255,255,.08);border:0;display:flex;align-items:center;justify-content:center;margin-bottom:10px;cursor:pointer;padding:0;flex:none}
.side-logo img{width:34px;height:34px;display:block}
.side-nav{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;width:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:4px 0}
.side-nav::-webkit-scrollbar{display:none}
.side .tab{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:#BCC0C6;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0;transition:background .15s,color .15s}
.side .tab svg.i{width:20px;height:20px}
.side .tab:hover{background:rgba(255,255,255,.09);color:#fff}
.side .tab.on{background:#fff;color:var(--coal)}
.side .tab .tlabel{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.side .tab .count{position:absolute;top:1px;right:0;min-width:17px;height:17px;border-radius:9px;background:#7D8187;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #303237;line-height:1}
.side .tab .count.alert{background:var(--sr)}
.side .sep{width:26px;height:1px;background:rgba(255,255,255,.14);margin:6px 0;flex:none}
.side-mark{position:fixed;left:80px;width:7px;height:22px;background:#2F3135;border-radius:0 6px 6px 0;z-index:61;transition:top .2s;pointer-events:none}
.side-bottom{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12);width:44px}
.side-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:#BCC0C6;display:flex;align-items:center;justify-content:center;cursor:pointer}
.side-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.side-btn .avatar{width:34px;height:34px;font-size:11px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.main-wrap{flex:1;min-width:0;margin-left:96px;display:flex;flex-direction:column}
/* encabezado claro */
.topline{display:flex;align-items:center;gap:14px;padding:16px 26px 4px;min-height:66px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.brand-logo-btn{background:none;border:0;padding:0;display:flex}
.brand-logo{height:34px;width:auto;display:block}
.brand-sep{width:1px;height:30px;background:#CDD0D5;flex:none}
.brand-text{min-width:0}
.brand-title{font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-title b{font-weight:800;letter-spacing:.2px}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap}
.top-btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;border:1px solid var(--rim);background:#fff;color:var(--ink);padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.04);font-family:inherit}
.top-btn:hover{background:var(--soft)}
.top-btn.solid{background:var(--coal);border-color:var(--coal);color:#fff}
.top-btn.solid:hover{background:#111214}
.bell{position:relative;width:40px;height:40px;justify-content:center;padding:0}
.bell .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--sr);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.mode-chip{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:12.5px;font-weight:600;padding:5px 12px 5px 6px;border-radius:999px;background:#fff;border:1px solid var(--rim);color:var(--muted);white-space:nowrap;cursor:pointer}
.mode-chip.view{padding-left:11px}
.mode-chip.edit{color:var(--ink)}
.mode-chip .avatar{width:28px;height:28px;font-size:10.5px}
.top-btn.sync.on .sd{background:var(--sv);box-shadow:0 0 0 3px var(--sv-soft)}
.top-btn.sync.wait .sd{background:var(--sa)}
.top-btn.sync.err .sd{background:var(--sr)}
.banner{max-width:none;margin:6px 0 0;padding:0 26px}
.banner-in{border:0;border-left:4px solid var(--oxford);border-radius:16px;box-shadow:var(--sh);padding:11px 16px}
main{max-width:1560px;width:100%;margin:0;padding:14px 26px 70px}
.crumbs{display:none}
.page-head{margin:4px 0 18px;align-items:flex-end}
.page-head h1{font-size:27px;font-weight:700;letter-spacing:-.5px}
.page-head p{font-size:13.2px;color:var(--muted);max-width:760px;line-height:1.5}
/* tarjetas, botones y campos */
.card{border:0;border-radius:var(--r-xl);box-shadow:var(--sh);padding:20px}
.card h2,.card h3{font-size:15.5px;font-weight:650;letter-spacing:-.1px}
.card h3 .sub{font-weight:500;font-size:12px}
.grid{gap:18px}
.btn{border-radius:999px;padding:9px 16px;border:1px solid var(--rim);background:#fff;font-weight:600}
.btn:hover{background:var(--soft);border-color:#D2D5DA}
.btn.primary{background:var(--coal);border-color:var(--coal);color:#fff}
.btn.primary:hover{background:#111214}
.btn.dark{background:var(--coal);border-color:var(--coal)}
.btn.soft{background:var(--soft2);border-color:transparent;color:var(--ink)}
.btn.soft:hover{background:#DFE1E5}
.btn.sm{padding:6px 12px;border-radius:999px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.iconbtn{border-radius:50%;width:32px;height:32px}
.seg{background:var(--soft2);border-radius:999px;padding:4px;gap:2px}
.seg button{border-radius:999px;padding:7px 14px}
.seg button.on{background:var(--coal);color:#fff;box-shadow:none}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=url],input[type=search],input[type=tel],select,textarea{border-radius:12px;border-color:var(--rim);background:#fff;padding:9px 12px}
.filters select,.filters input{border-radius:999px;padding:8px 14px}
.chip{border-radius:999px}
.empty{border-radius:18px;background:var(--soft);border-color:#D3D6DB}
.tblwrap{border:0;border-radius:var(--r-lg);box-shadow:var(--sh)}
.tbl th{background:#fff;color:#7D8187;font-weight:600;border-bottom:1px solid var(--line2)}
.tbl tbody tr:hover td{background:#F8F9FA}
.blk{border-radius:10px}
.status,.sem{border-radius:999px}
.modal{border-radius:24px}
.modal-head{padding:18px 22px}
.modal-body{padding:18px 22px}
.modal-foot{border-radius:0 0 24px 24px;padding:14px 22px;background:#F7F8F9}
.menu{border-radius:16px;border:0;box-shadow:0 18px 48px rgba(18,19,22,.22)}
.toast{border-radius:999px;padding:10px 18px}
.kb-col{background:#E3E5E9;border-radius:22px;border-color:transparent}
.kb-card{border-radius:16px;border:0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.gantt{border:0;border-radius:var(--r-lg);box-shadow:var(--sh)}
.g-bar{border-radius:999px}
.doc-nav,.doc-body{border:0;box-shadow:var(--sh);border-radius:var(--r-xl)}
.oficio{border:0;border-radius:10px}
.callout{border-radius:14px;border:0;border-left:4px solid var(--oxford)}
.avatar{background:#4A4E52}
.avatar.a-vocal{background:#2A2C30} .avatar.a-staff{background:#54585A} .avatar.a-tce{background:#646A70} .avatar.a-val{background:#7A7F86} .avatar.a-vyd{background:#8A8F96}
.avatar.vacante{background:#fff}
.k-verde-soft{background:var(--sv-soft);color:var(--sv-ink)} .k-amarillo-soft{background:var(--sa-soft);color:var(--sa-ink2)} .k-rojo-soft{background:var(--sr-soft);color:var(--sr-ink)} .k-vencida-soft{background:var(--sx-soft);color:var(--sx-ink)} .k-concluida-soft{background:var(--sc-soft);color:#3B3E43}

/* ---------- Inicio ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.dash-main,.dash-rail{display:flex;flex-direction:column;gap:18px;min-width:0}
.row3{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.85fr);gap:18px}
.row2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
.col2{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero{position:relative;overflow:hidden;background:linear-gradient(112deg,#F6F7F8 0%,#E9EBEE 42%,#D9DCE0 100%);padding:28px 30px;min-height:168px;display:flex;align-items:center}
.hero .hx{position:relative;z-index:1;max-width:600px}
.hero .hk2{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#6A6E71;margin-bottom:6px}
.hero h2{font-size:27px;font-weight:700;letter-spacing:-.6px;margin:0 0 6px;line-height:1.15}
.hero p{margin:0 0 16px;color:#45494B;font-size:13.5px;line-height:1.55;max-width:520px}
.hero .art,.cv-band .art{overflow:visible}
.hero .art{position:absolute;right:36px;top:50%;width:250px;height:180px;transform:translateY(-50%);pointer-events:none}
.ctitle{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.ctitle h3{margin:0;white-space:nowrap}
.ctitle .spacer{flex:1}
.cicon{width:30px;height:30px;border-radius:50%;border:1px solid var(--rim);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex:none;padding:0}
.cicon:hover{background:var(--soft)}
.members{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 6px}
.member{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:transparent;cursor:pointer;padding:6px 2px;border-radius:16px;font:inherit;color:inherit;min-width:0}
.member:hover{background:var(--soft)}
.member .avatar{width:48px;height:48px;font-size:14px}
.member .mn{font-size:11.8px;font-weight:600;text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .mc{font-size:10.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bignum{font-size:46px;font-weight:600;letter-spacing:-1.8px;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{font-size:18px;color:var(--muted);font-weight:500;letter-spacing:0;margin-left:2px}
.segbars{display:flex;gap:8px;margin-top:20px;align-items:flex-start}
.segbars .sb{display:flex;flex-direction:column;gap:7px;min-width:44px;cursor:pointer}
.segbars .sb .bar{height:12px;border-radius:999px}
.segbars .sb .v{font-size:11px;color:var(--muted);white-space:nowrap}
.segbars .sb .v b{color:var(--ink);font-size:12px;margin-right:3px}
.segbars .dashbar{background:repeating-linear-gradient(90deg,#C4C8CE 0 6px,transparent 6px 10px)}
.vbars{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:158px;margin-top:4px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;cursor:pointer;border:0;background:transparent;padding:0;font:inherit;color:inherit;min-width:0}
.vbar .track{flex:1;width:100%;max-width:30px;background:var(--soft2);border-radius:999px;display:flex;align-items:flex-end;overflow:hidden}
.vbar .fill{width:100%;border-radius:999px;min-height:10px;transition:height .3s}
.vbar .vn{font-size:12.5px;font-weight:700;line-height:1}
.vbar .vl{font-size:9.8px;color:var(--muted);line-height:1.1;text-align:center;white-space:nowrap}
.stats-top{display:flex;align-items:center;gap:14px;margin:4px 0 18px;flex-wrap:wrap}
.stats-top .sep{width:2px;height:34px;background:var(--rim)}
.stats-top .bignum.light{color:#9A9EA4}
.stats-top .lab{font-size:12px;color:var(--muted);line-height:1.3}
.statsub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stile{background:var(--soft);border-radius:18px;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;border:0;font:inherit;color:inherit;transition:background .15s,transform .12s}
.stile:hover{background:var(--soft2);transform:translateY(-1px)}
.stile .ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#7D8187}
.stile .ico svg{width:34px;height:34px;stroke-width:1.4}
.stile .sn{font-size:20px;font-weight:700;line-height:1}
.stile .sl{font-size:11.5px;color:var(--muted)}
.card.dark{background:linear-gradient(160deg,#34363B,#232428);color:#fff}
.card.dark h3,.card.dark .ctitle h3{color:#fff}
.card.dark .muted{color:#B9BDC3}
.nextpill{background:#fff;color:var(--ink);border-radius:20px;padding:11px 12px;display:flex;align-items:center;gap:11px;box-shadow:0 10px 24px rgba(0,0,0,.28);cursor:pointer;border:0;width:100%;font:inherit;text-align:left}
.nextpill .nic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.nextpill .nt{font-weight:700;font-size:13px;line-height:1.25}
.nextpill .nm{font-size:11.5px;color:var(--muted);margin-top:2px}
.nextpill .go{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.promo{display:flex;align-items:center;gap:16px;overflow:hidden;position:relative;padding:14px 20px 14px 10px}
.promo .art{width:120px;height:120px;flex:none}
.promo h4{font-size:17px;margin:0 0 4px;font-weight:700;letter-spacing:-.2px}
.promo p{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.45}
.alist2{display:flex;flex-direction:column}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line2)}
.arow:last-child{border-bottom:0}
.arow .tt{font-weight:600;cursor:pointer;line-height:1.3}
.arow .tt:hover{text-decoration:underline}
.arow .meta{font-size:11.8px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;align-items:center}
.mtask{border:0;background:var(--soft);box-shadow:none;border-top:0;border-radius:20px;position:relative;overflow:hidden;padding:14px 14px 13px 18px}
.mtask::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--silver)}
.mtask.s-verde::before{background:var(--sv)} .mtask.s-amarillo::before{background:var(--sa)} .mtask.s-rojo::before{background:var(--sr)} .mtask.s-vencida::before{background:var(--sx)} .mtask.s-concluida::before{background:var(--sc)}
.stepper{border-radius:999px;background:#fff}
.stepper button{background:#fff}
/* calendario y avisos */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.cal-head h3{margin:0;font-size:21px;font-weight:600;letter-spacing:-.4px;text-transform:capitalize}
.cal-nav{width:32px;height:32px;border-radius:50%;border:1px solid var(--rim);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cal-nav:hover{background:var(--soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wd{border:0;background:transparent;border-radius:16px;padding:8px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:inherit;color:inherit}
.wd:hover{background:var(--soft)}
.wd .w1{font-size:10.5px;color:var(--muted);font-weight:600}
.wd .w2{font-size:14.5px;font-weight:700;line-height:1}
.wd .dots{display:flex;gap:2px;height:5px;align-items:center}
.wd .dots i{width:5px;height:5px;border-radius:50%;display:block}
.wd.on{background:var(--coal);color:#fff}
.wd.on .w1{color:#C4C8CE}
.wd.today:not(.on) .w2{box-shadow:inset 0 -2px 0 var(--ink);padding-bottom:2px}
.duehead{display:flex;align-items:center;gap:8px;margin:16px 0 10px}
.duehead b{font-size:14.5px}
.duelist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dcard{border:1px solid var(--rim);border-radius:18px;padding:7px 7px 9px;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:7px;min-width:0;font:inherit;text-align:left;color:inherit}
.dcard:hover{box-shadow:var(--sh)}
.dthumb{height:70px;border-radius:13px;display:flex;align-items:center;justify-content:center;position:relative}
.dthumb .ring2{width:44px;height:44px}
.dthumb .tag{position:absolute;bottom:5px;right:6px;font-size:9.5px;font-weight:800;background:rgba(20,21,24,.78);color:#fff;border-radius:999px;padding:1px 6px}
.dcard .dt{font-size:11.8px;font-weight:650;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding:0 3px}
.dcard .dm{font-size:10.5px;color:var(--muted);display:flex;gap:6px;padding:0 3px;align-items:center;flex-wrap:wrap}
.ntabs{display:flex;gap:18px;border-bottom:1px solid var(--rim);margin:2px 0 4px}
.ntabs button{border:0;background:transparent;padding:6px 0 9px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.ntabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:650}
.nlist{display:flex;flex-direction:column}
.nitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 2px;border-bottom:1px solid var(--line2)}
.nitem:last-child{border-bottom:0}
.nitem .avatar{width:32px;height:32px;font-size:11px}
.nitem .nx{font-size:12.3px;line-height:1.4}
.nitem.unread .nx{font-weight:650}
.nitem .nw{font-size:10.5px;color:var(--muted);margin-top:4px}
.linkpill{display:inline-flex;align-items:center;gap:5px;background:var(--coal);color:#fff;border:0;border-radius:999px;padding:5px 11px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.linkpill:hover{background:#000}
.linkpill svg.i{width:12px;height:12px}
/* ---------- Mi espacio ---------- */
.cover{padding:0;overflow:hidden}
.cv-band{height:120px;background:linear-gradient(112deg,#F3F4F6 0%,#E6E8EB 50%,#D6D9DD 100%);position:relative;overflow:hidden}
.cv-band .art{position:absolute;right:40px;top:50%;width:150px;height:108px;transform:translateY(-50%)}
.cv-body{display:flex;align-items:flex-end;gap:16px;padding:0 24px 20px;margin-top:-40px;position:relative;flex-wrap:wrap}
.avatar.xl{width:92px;height:92px;font-size:28px;border:5px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.cv-body h2{margin:0;font-size:23px;font-weight:700;letter-spacing:-.4px}
.cv-body .cv-sub{font-size:12.8px;color:var(--muted);margin-top:2px}
.cv-body .cv-meta{font-size:11.8px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.statuspill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;white-space:nowrap}
.statuspill i{width:8px;height:8px;border-radius:50%}
.statuspill.ok{background:var(--sv-soft);color:var(--sv-ink)} .statuspill.ok i{background:var(--sv)}
.statuspill.warn{background:var(--sa-soft);color:var(--sa-ink2)} .statuspill.warn i{background:var(--sa)}
.statuspill.bad{background:var(--sr-soft);color:var(--sr-ink)} .statuspill.bad i{background:var(--sr)}
.statuspill.idle{background:var(--soft2);color:var(--muted)} .statuspill.idle i{background:var(--steel)}
.ptiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.ptile{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit;border:0}
.ptile:hover{box-shadow:var(--sh-hover)}
.ptile .pk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.ptile .pic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--soft2);color:var(--ink)}
.ptile .pv{font-size:30px;font-weight:600;letter-spacing:-1px;line-height:1}
.ptile .pd{font-size:11.5px;color:var(--muted)}
.focus{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;height:190px;padding-top:18px}
.fday{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;cursor:pointer;border:0;background:transparent;padding:0;font:inherit;color:inherit;min-width:0}
.fday .ftrack{flex:1;width:100%;max-width:36px;background:var(--soft2);border-radius:999px;position:relative;display:flex;align-items:flex-end}
.fday .ffill{width:100%;border-radius:999px;background:linear-gradient(180deg,#A9ADB3,#6A6E71)}
.fday.today .ffill{background:linear-gradient(180deg,#54585A,#2A2C30)}
.fday .fval{position:absolute;left:50%;transform:translate(-50%,-130%);background:var(--coal);color:#fff;font-size:10.5px;font-weight:800;border-radius:7px;padding:2px 7px;white-space:nowrap}
.fday .fl{font-size:11px;color:var(--muted);font-weight:600}
.fday.today .fl{color:var(--ink)}
.actlist{display:flex;flex-direction:column}
.actrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.actrow:last-child{border-bottom:0}
.actrow .adot{width:30px;height:30px;border-radius:50%;background:var(--soft2);display:flex;align-items:center;justify-content:center}
.picker-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rim);background:#fff;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600}
.pchip .avatar{width:26px;height:26px;font-size:10px}
.pchip.on{background:var(--coal);border-color:var(--coal);color:#fff}
/* ---------- Evidencias ---------- */
.evwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
.evcard{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.evthumb{height:118px;border-radius:15px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.evthumb .evic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.evthumb .evtag{position:absolute;top:9px;left:9px;background:var(--coal);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 9px}
.evcard .et{font-size:12.8px;font-weight:650;padding:0 6px;line-height:1.3;cursor:pointer}
.evcard .et:hover{text-decoration:underline}
.evcard .em{display:flex;align-items:center;gap:6px;padding:0 6px 4px;font-size:11px;color:var(--muted)}
.evcard .em .spacer{flex:1}
.rbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--rim);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);padding:0;text-decoration:none}
.rbtn:hover{background:var(--soft)}
.rbtn.dark{background:var(--coal);border-color:var(--coal);color:#fff}
.rbtn svg.i{width:14px;height:14px}
.citem{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;cursor:pointer}
.citem .cic{width:32px;height:32px;border-radius:10px;background:var(--soft2);display:flex;align-items:center;justify-content:center}
.citem.on .cic{background:var(--coal);color:#fff}
.citem .progress{margin-top:6px;height:5px}
/* ---------- Trabajo en equipo ---------- */
.cloudwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.ringcard{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring3{width:150px;height:150px;flex:none}
.legrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px;padding:5px 0}
.legrow i{width:10px;height:10px;border-radius:50%}
.devgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.devcard{background:var(--soft);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.devcard.mine{background:#fff;box-shadow:inset 0 0 0 2px var(--oxford)}
.devcard .dic{width:36px;height:36px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:4px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.devcard b{font-size:13px}
.devcard .tiny{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- Equipo ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:20px 16px 16px;position:relative}
.pcard .avatar{width:64px;height:64px;font-size:19px;margin-bottom:4px}
.pcard .pn{font-weight:700;font-size:13.5px;line-height:1.25}
.pcard .pr{font-size:11.8px;color:var(--muted);line-height:1.3}
.pcard .pa{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.pcard .gsum{width:150px;height:9px;margin-top:6px}
.subtabs{margin-bottom:16px}
/* ---------- complementos del diseño 3 ---------- */
.hero .hx .row{gap:8px}
.hsteps{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-4px 0 16px}
.hsteps span{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.72);border-radius:999px;padding:5px 12px 5px 5px;font-size:12px;font-weight:600;color:#3B3E43}
.hsteps b{width:21px;height:21px;border-radius:50%;background:var(--coal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.linkbtn{border:0;background:transparent;font:inherit;font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
.mav{position:relative;display:inline-flex}
.mav .mdot{position:absolute;right:-1px;bottom:1px;width:13px;height:13px;border-radius:50%;border:2.5px solid #fff}
.member .avatar{width:44px;height:44px;font-size:13.5px}
.avatar.xs{width:19px;height:19px;font-size:8px;letter-spacing:0}
.b-coal{background:var(--coal)} .b-oxford{background:var(--oxford)} .b-steel{background:#8E9399} .b-stripe{background:repeating-linear-gradient(135deg,#2F3135 0 5px,#55585D 5px 10px)}
.segbars .sb{flex:1 1 0;border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;min-width:46px}
.segbars .sb .v{white-space:normal;line-height:1.25;font-size:10.8px}
.segbars .sb .v b{display:block;font-size:15px;margin:0 0 1px}
.ctitle .seg{padding:3px}
.ctitle .seg button{padding:5px 11px;font-size:12px}
.cv-body{align-items:flex-start}
.cv-id{flex:1;min-width:220px;margin-top:48px}
.cv-act{margin-top:48px}
.fday[disabled]{cursor:default}
.segbars .sb:hover .bar{filter:brightness(1.12)}
.avg-sub{font-size:12px;color:var(--muted);margin-top:6px}

<h2>Work OS de la Vocalía de Capacitación Electoral y Educación Cívica</h2>
