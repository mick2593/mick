<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1EFE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bitácora de Miguel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de una columna con barra de pestañas fija abajo; tarjetas por hábito; mismo lenguaje visual que la Ficha de Ejecución */
:root{
  --paper:#F1EFE9; --panel:#FFFFFF; --ink:#16181B; --muted:#5B5E63; --soft:#E7E3DA;
  --accent:#E8622C; --accent-2:#1F6E80; --ok:#2F7D4F; --warn:#B3261E; --line:rgba(22,24,27,0.14);
  --rest-chip:#EDE3D8; --ink-inv:#FFFFFF;
  --font-display:'Barlow Condensed',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121316; --panel:#1B1D21; --ink:#ECEAE4; --muted:#9EA1A7; --soft:#26282D;
    --accent:#FF7A45; --accent-2:#4FB6C9; --ok:#5DBB82; --warn:#FF8A80; --line:rgba(236,234,228,0.16);
    --rest-chip:#2A2520; --ink-inv:#121316; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121316; --panel:#1B1D21; --ink:#ECEAE4; --muted:#9EA1A7; --soft:#26282D;
  --accent:#FF7A45; --accent-2:#4FB6C9; --ok:#5DBB82; --warn:#FF8A80; --line:rgba(236,234,228,0.16);
  --rest-chip:#2A2520; --ink-inv:#121316; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.45; -webkit-tap-highlight-color:transparent}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--paper)}
button{font:inherit; color:inherit}
input,textarea,select{font:inherit; color:var(--ink)}
h1,h2,h3{font-family:var(--font-display); margin:0; letter-spacing:.01em; text-wrap:balance}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
.wrap{max-width:640px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* top */
header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:6; background:var(--paper); border-bottom:1px solid var(--line)}
header.top .wrap{display:flex; align-items:center; gap:10px; padding-block:10px}
.brand{font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:.02em}
.brand b{color:var(--accent)}
.datebar{margin-left:auto; display:flex; align-items:center; gap:4px}
.iconbtn{background:transparent; border:1px solid var(--line); border-radius:999px; min-width:36px; height:36px; padding:0 10px; cursor:pointer; font-family:var(--font-mono); font-size:13px}
.iconbtn:focus-visible,.chipbtn:focus-visible,.tabs button:focus-visible,.check:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.dlabel{font-family:var(--font-mono); font-size:13px; font-weight:600; min-width:96px; text-align:center}
.store{font-family:var(--font-mono); font-size:10.5px; color:var(--muted); padding-block:0 8px; display:flex; gap:8px; align-items:center}
.store i{width:7px; height:7px; border-radius:50%; background:var(--muted); display:inline-block}
.store.cloud i{background:var(--ok)} .store.local i{background:var(--accent)}

main{padding-block:14px 150px}
.section-title{font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:22px 0 8px; display:flex; align-items:center; gap:10px}
.section-title::after{content:""; flex:1; border-top:1px solid var(--line)}

/* hero of the day */
.dayhero{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px}
.dayhero h1{font-size:30px; font-weight:800; line-height:1.05}
.dayhero .sub{color:var(--muted); font-size:13.5px; margin-top:4px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.chip{font-family:var(--font-mono); font-size:11px; border:1px solid var(--line); border-radius:4px; padding:3px 8px; white-space:nowrap}
.chip.acc{border-color:var(--accent); color:var(--accent); font-weight:600}
.chip.teal{border-color:var(--accent-2); color:var(--accent-2); font-weight:600}
.chip.deload{background:var(--accent-2); color:var(--ink-inv); border-color:var(--accent-2); font-weight:700}
.ring{width:76px; height:76px}
.ring .bg{stroke:var(--soft)} .ring .fg{stroke:var(--accent); transition:stroke-dashoffset .4s}
.ring text{fill:var(--ink); font-family:var(--font-mono); font-weight:600}
.banner{margin-top:12px; border-radius:6px; padding:10px 12px; font-size:13.5px; background:var(--rest-chip); border-left:4px solid var(--accent-2)}
.banner.warn{border-left-color:var(--warn)}

/* cards */
.card{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; margin-top:10px}
.cardhead{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.cardhead h2{font-size:20px; font-weight:700}
.cardhead .meta{margin-left:auto; font-family:var(--font-mono); font-size:12px; color:var(--muted)}
.cardhead .meta.good{color:var(--ok); font-weight:600}
.row{display:flex; align-items:center; gap:10px; padding-block:8px; border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .txt{flex:1; min-width:0}
.row .t1{font-weight:600; font-size:14.5px}
.row .t2{color:var(--muted); font-size:12.5px}
.row .time{font-family:var(--font-mono); font-size:12px; color:var(--accent-2); font-weight:600; width:44px; flex:0 0 44px}
.check{flex:0 0 30px; width:30px; height:30px; border-radius:7px; border:1.5px solid var(--muted); background:transparent; cursor:pointer; display:grid; place-items:center; padding:0}
.check svg{width:18px; height:18px; opacity:0}
.check[aria-pressed="true"]{background:var(--ok); border-color:var(--ok)}
.check[aria-pressed="true"] svg{opacity:1}
.check svg path{stroke:var(--ink-inv)}
.linkbtn{background:none; border:0; padding:0; color:var(--accent-2); font-weight:600; font-size:12.5px; cursor:pointer; text-align:left}
.detail{font-size:12.5px; color:var(--muted); margin-top:4px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
label.f{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.05em}
.inp{border:1px solid var(--line); background:var(--paper); border-radius:6px; height:42px; padding:0 10px; font-family:var(--font-mono); font-size:16px; width:100%; min-width:0}
.inp:focus{outline:2px solid var(--accent-2); outline-offset:0; border-color:transparent}
textarea.inp{height:auto; min-height:72px; padding:10px; font-family:var(--font-body); font-size:15px; resize:vertical}
.big{font-family:var(--font-display); font-size:34px; font-weight:800; line-height:1}
.unit{font-family:var(--font-mono); font-size:12px; color:var(--muted); margin-left:4px}
.bar{height:8px; border-radius:99px; background:var(--soft); overflow:hidden; margin-top:8px}
.bar i{display:block; height:100%; background:var(--accent-2); border-radius:99px}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.chipbtn{border:1px solid var(--line); background:transparent; border-radius:999px; min-height:34px; padding:0 12px; cursor:pointer; font-family:var(--font-mono); font-size:12.5px}
.chipbtn[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.glasses{display:flex; gap:5px; flex-wrap:wrap; margin-top:6px}
.glass{width:26px; height:34px; border:1.5px solid var(--accent-2); border-radius:3px 3px 7px 7px; background:transparent; cursor:pointer; padding:0; position:relative; overflow:hidden}
.glass[aria-pressed="true"]::after{content:""; position:absolute; inset:30% 0 0; background:var(--accent-2); opacity:.85}
.slider{display:flex; align-items:center; gap:10px; padding-block:6px}
.slider span.l{width:70px; font-size:13.5px; font-weight:600}
.slider input{flex:1; accent-color:var(--accent)}
.slider b{width:32px; text-align:right; font-family:var(--font-mono)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:0; border-radius:8px; min-height:44px; padding:0 16px; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; font-size:14.5px}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
.btn.full{width:100%}
.btn.done{background:var(--ok)}

/* entreno */
.exhead{display:flex; gap:8px; align-items:flex-start}
.exhead h3{font-family:var(--font-body); font-size:16px; font-weight:700; flex:1; min-width:0}
.last{font-family:var(--font-mono); font-size:11.5px; color:var(--muted); margin-top:8px}
.hint{font-size:13px; margin-top:6px; padding:8px 10px; border-radius:6px; background:var(--rest-chip)}
.hint.up{background:transparent; border:1px solid var(--ok); color:var(--ok); font-weight:600}
.sets{display:grid; gap:6px; margin-top:10px}
.setrow{display:grid; grid-template-columns:52px 1fr 14px 1fr 44px; gap:6px; align-items:center}
.setrow.iso{grid-template-columns:52px 1fr 44px}
.setrow .n{font-family:var(--font-mono); font-size:11.5px; color:var(--muted)}
.setrow .x{text-align:center; color:var(--muted); font-family:var(--font-mono)}
.setrow .inp{height:40px; text-align:center}
.setrow .check{width:44px; height:40px; flex-basis:44px; border-radius:8px}
.alt{border-style:dashed}
.alt .exhead h3::before{content:"Alternativa · "; color:var(--accent-2)}
.warmitem .t1{display:flex; gap:6px; align-items:baseline; flex-wrap:wrap}
.ramp{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.ramp span{font-family:var(--font-mono); font-size:11.5px; border:1px solid var(--line); border-radius:4px; padding:5px 8px; background:var(--paper)}
.ramp span.w{background:var(--accent); color:#fff; border-color:var(--accent)}
.note{font-size:12.5px; color:var(--muted); margin-top:8px; border-left:3px solid var(--accent); padding-left:8px}

/* timer */
#timer{position:fixed; left:0; right:0; bottom:calc(62px + env(safe-area-inset-bottom,0px)); z-index:8; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
#timer .box{max-width:640px; margin:0 auto; background:var(--ink); color:var(--paper); border-radius:10px; padding:10px 12px; display:flex; align-items:center; gap:10px; box-shadow:0 6px 20px rgba(0,0,0,.25)}
#timer .tt{flex:1; min-width:0}
#timer .lab{font-size:11px; font-family:var(--font-mono); opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#timer .clock{font-family:var(--font-display); font-size:30px; font-weight:800; line-height:1}
#timer .clock.end{color:var(--accent)}
#timer button{background:transparent; border:1px solid currentColor; color:inherit; border-radius:999px; height:34px; min-width:44px; font-family:var(--font-mono); font-size:12px; cursor:pointer}

/* tabs */
nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:9; background:var(--panel); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none; border:0; height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; color:var(--muted); font-size:11px; font-weight:600}
nav.tabs svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
#sheet{position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center}
#sheet .panel{background:var(--panel); width:100%; max-width:640px; max-height:92vh; overflow:auto; border-radius:14px 14px 0 0; padding:16px max(16px, env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
#sheet .sh{display:flex; align-items:flex-start; gap:10px}
#sheet h2{font-size:24px; flex:1}
dl.steps{margin:12px 0 0; display:grid; gap:8px}
dl.steps dt{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:600; color:var(--accent-2)}
dl.steps dt.err{color:var(--accent)}
dl.steps dd{margin:0; font-size:14px}

/* animación */
.pictile{background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:8px; display:flex; flex-direction:column; gap:6px; margin-top:12px}
svg.stage{display:block; width:100%; max-width:420px; margin:0 auto; height:auto; aspect-ratio:260/240}
.stage line{stroke-linecap:round}
.stage .b{stroke:var(--ink)} .stage .h{stroke:var(--accent)} .stage .g{stroke:var(--muted); opacity:.24}
.stage .e{stroke:var(--muted)} .stage .bar{stroke:var(--ink)} .stage .k{stroke:var(--muted)} .stage .f{stroke:var(--line)}
.stage .pad{fill:var(--line); stroke:var(--muted)}
.stage .plate{fill:var(--panel); fill-opacity:.6; stroke:var(--ink); stroke-width:1}
.stage .torso{fill:var(--ink); fill-opacity:.1; stroke:none}
.stage .torsoh{fill:var(--accent); fill-opacity:.3; stroke:none}
.stage .head{fill:var(--paper); stroke:var(--ink); stroke-width:1.6}
.stage .jt{fill:var(--ink)}
.stage .arc{fill:none; stroke:var(--accent-2); stroke-width:2.2; stroke-linecap:round}
.livebox{display:flex; flex-direction:column; gap:6px}
.live{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; font-family:var(--font-mono); font-size:12px; min-height:20px}
.live .ph{font-weight:700; color:var(--accent); min-width:62px}
.live .ph.pausa,.live .ph.mantén{color:var(--accent-2)}
.live .tm{color:var(--muted)} .live .ang{margin-left:auto; color:var(--accent-2); font-weight:600}
.ctl{display:flex; flex-wrap:wrap; gap:5px}
.ctl button{font-family:var(--font-mono); font-size:11px; background:transparent; border:1px solid var(--line); border-radius:999px; padding:6px 10px; min-height:32px; cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.phase{font-family:var(--font-mono); font-size:10.5px; color:var(--muted); text-align:center}

/* charts */
.chart{width:100%; height:auto; display:block; margin-top:8px}
.chart .gl{stroke:var(--line)} .chart .ax{fill:var(--muted); font-family:var(--font-mono); font-size:9px}
.chart .am{fill:var(--accent-2)} .chart .pm{fill:none; stroke:var(--muted); stroke-width:1.2}
.chart .avg{fill:none; stroke:var(--accent); stroke-width:2.2}
.chart .bars{fill:var(--accent-2)} .chart .bars.low{fill:var(--muted); opacity:.5}
.chart .goal{stroke:var(--accent); stroke-dasharray:4 3; stroke-width:1.2}
.chart .l1{fill:none; stroke:var(--accent); stroke-width:2} .chart .l2{fill:none; stroke:var(--accent-2); stroke-width:2}
.chart .d1{fill:var(--accent)} .chart .d2{fill:var(--accent-2)}
.wtop{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:12px}
.wbig{font-family:var(--font-display); font-size:52px; font-weight:800; line-height:.95; letter-spacing:-.01em; font-variant-numeric:tabular-nums}
.wunit{font-family:var(--font-mono); font-size:15px; color:var(--muted); margin-left:6px}
.wdate{font-family:var(--font-mono); font-size:12px; color:var(--muted); margin-top:6px}
.pill{font-family:var(--font-mono); font-size:12.5px; font-weight:600; border-radius:999px; padding:5px 11px; background:var(--soft); color:var(--muted)}
.pill.up{background:color-mix(in srgb, var(--ok) 18%, transparent); color:var(--ok)}
.pill.down{background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--accent)}
.segbar{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; background:var(--soft); border-radius:12px; padding:4px; margin-top:14px}
.segbar button{border:0; background:transparent; border-radius:9px; min-height:38px; font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--muted); cursor:pointer}
.segbar button[aria-pressed="true"]{background:var(--accent-2); color:var(--ink-inv)}
.segbar button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.wchart{margin-top:14px}
.chart .gs1{stop-color:var(--accent-2); stop-opacity:.38} .chart .gs2{stop-color:var(--accent-2); stop-opacity:0}
.chart .warea{fill:url(#wgrad)}
.chart .wline{fill:none; stroke:var(--accent-2); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.chart .wpt{fill:var(--panel); stroke:var(--accent-2); stroke-width:2}
.chart .wpt.pm{stroke-dasharray:2 1.6}
.chart .wlab{fill:var(--accent-2); font-family:var(--font-mono); font-size:10.5px; font-weight:600}
.chart .goalw{stroke:var(--accent); stroke-width:1.3; stroke-dasharray:5 4}
.chart .goalt{fill:var(--accent); font-family:var(--font-mono); font-size:10px; font-weight:600}
/* pasos */
.steptot{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-top:12px; padding:10px 12px; border-radius:8px; background:var(--paper)}
.steptot span{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.steptot b{font-family:var(--font-display); font-size:30px; font-weight:800; font-variant-numeric:tabular-nums}
/* gastos */
.costin{flex:0 0 92px; width:92px; height:38px; text-align:right}
.spend .wbig{font-size:44px}
/* reflexión */
.qcard{display:flex; flex-direction:column; gap:6px; width:100%; text-align:left; margin-top:10px; padding:14px 16px; border-radius:8px; border:1px solid var(--line); border-left:4px solid var(--accent-2); background:var(--panel); cursor:pointer}
.qcard .qk{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent-2); font-weight:600}
.qcard .qt{font-size:15px; line-height:1.45}
.qcard .qa{font-family:var(--font-mono); font-size:11.5px; color:var(--muted)}
.welcome .sh{display:flex; align-items:center; gap:10px}
.welcome .wk{flex:1; font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.welcome .wg{font-size:34px; font-weight:800; margin-top:14px; line-height:1.05}
.welcome .wtheme{display:inline-block; margin-top:10px; font-family:var(--font-mono); font-size:11px; color:var(--accent-2); border:1px solid var(--accent-2); border-radius:999px; padding:3px 10px}
.welcome .wq{margin:18px 0 0; padding:0 0 0 14px; border-left:4px solid var(--accent); font-family:var(--font-display); font-size:27px; font-weight:700; line-height:1.18; text-wrap:balance}
.welcome .wq cite{display:block; margin-top:10px; font-family:var(--font-mono); font-size:12.5px; font-weight:500; font-style:normal; color:var(--muted)}
.welcome .wmine{margin-top:18px; padding:12px 14px; border-radius:8px; background:var(--ink); color:var(--paper); font-weight:700; font-size:16px}
.welcome .wmine span{display:block; font-family:var(--font-mono); font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:.08em; opacity:.7; margin-bottom:4px}
.welcome .wplan{margin-top:12px; font-size:14px; color:var(--muted)}
.welcome .wplan b{color:var(--ink)}
/* insignias */
.medals{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px}
.mcell{display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; padding:10px 4px; border-radius:8px; background:var(--paper)}
.mcell b{font-size:12.5px; line-height:1.2; margin-top:4px}
.mcell span{font-family:var(--font-mono); font-size:10.5px; color:var(--muted)}

<script>
/* Motor de animación 3D: esqueleto con longitudes fijas + IK de brazos/piernas + cámara ortográfica.
   Unidades: cm. x = lateral, y = arriba, z = hacia donde mira la persona. */
var GX = (function(){
'use strict';
var R = Math.PI/180;
var TL=50, UA=29, FA=27, TH=42, SHN=43, HEADR=10, SHW=19, HIPW=9;
var EX = {};

/* ---------- vectores ---------- */
function add(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]}
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]}
function mul(a,k){return [a[0]*k,a[1]*k,a[2]*k]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function len(a){return Math.sqrt(dot(a,a))}
function nrm(a){var l=len(a)||1;return [a[0]/l,a[1]/l,a[2]/l]}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function lerp(a,b,t){return a+(b-a)*t}
function nlerp(a,b,t){return nrm(mix(a,b,t))}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function sm(x){x=clamp(x,0,1);return x*x*(3-2*x)}
function rotY(v,deg){var c=Math.cos(deg*R),s=Math.sin(deg*R);return [v[0]*c+v[2]*s,v[1],-v[0]*s+v[2]*c]}

/* ---------- IK de dos segmentos ---------- */
var ikErr = 0;
function ik(a,t,l1,l2,pole){
  var d=sub(t,a), D=len(d), mx=l1+l2-0.05, mn=Math.abs(l1-l2)+0.05;
  if(D-mx>ikErr) ikErr=D-mx;
  var Dc=clamp(D,mn,mx), u=mul(d,1/(D||1));
  var aa=(l1*l1-l2*l2+Dc*Dc)/(2*Dc), h=Math.sqrt(Math.max(0,l1*l1-aa*aa));
  var pp=sub(pole,mul(u,dot(pole,u))), pl=len(pp);
  pp = pl<1e-6 ? [0,0,1] : mul(pp,1/pl);
  return [add(add(a,mul(u,aa)),mul(pp,h)), add(a,mul(u,Dc))];
}

/* ---------- esqueleto ---------- */
/* o: P (pelvis), lean, roll, yaw, nk (flexión de cuello), arm[2], leg[2]; lado 0 = x- (lado cercano en vista lateral), 1 = x+ */
function rig(o){
  var t=(o.lean||0)*R, ro=(o.roll||0)*R;
  var r=[1,0,0], u=[0,Math.cos(t),Math.sin(t)], f=[0,-Math.sin(t),Math.cos(t)];
  if(ro){var c=Math.cos(ro),s=Math.sin(ro);var f2=add(mul(f,c),mul(r,s)),r2=sub(mul(r,c),mul(f,s));f=f2;r=r2}
  var ya=o.yaw||0; if(ya){r=rotY(r,ya);u=rotY(u,ya);f=rotY(f,ya)}
  var P=o.P, N=add(P,mul(u,TL)), nk=(o.nk||0)*R;
  var hd=nrm(add(mul(u,Math.cos(nk)),mul(f,Math.sin(nk))));
  var sk={noTorso:!!o.noTorso,P:P,N:N,H:add(N,mul(hd,21)),u:u,f:f,r:r,sh:[],el:[],wr:[],hp:[],kn:[],an:[],toe:[]};
  var fwd=rotY([0,0,1],ya);
  for(var i=0;i<2;i++){
    var sg=i?1:-1;
    var sh=add(N,mul(r,SHW*sg)), hp=add(P,mul(r,HIPW*sg));
    sk.sh[i]=sh; sk.hp[i]=hp;
    var A=(o.arm&&o.arm[i])||{};
    if(A.rel){sk.el[i]=add(sh,A.rel[0]);sk.wr[i]=add(sh,A.rel[1])}
    else if(A.el){sk.el[i]=A.el;sk.wr[i]=A.wr}
    else{
      var tg=A.wr||add(sh,[sg*5,-52,3]);
      var e=ik(sh,tg,UA,FA,A.pole||[sg*0.2,-0.3,-1]);
      sk.el[i]=e[0];sk.wr[i]=e[1];
    }
    var L=(o.leg&&o.leg[i])||{};
    var an=L.back?sub(hp,mul(u,L.back)):(L.an||[sg*10,8,0]);
    if(L.kn){sk.kn[i]=L.kn;sk.an[i]=L.an}
    else{var k=ik(hp,an,TH,SHN,L.pole||[sg*0.1,0,1]);sk.kn[i]=k[0];sk.an[i]=k[1]}
    sk.toe[i]=L.toe||(L.toeRel?add(sk.an[i],L.toeRel):add(sk.an[i],add(mul(L.dir||fwd,14),[0,-6,0])));
  }
  return sk;
}

/* ---------- primitivas ---------- */
function S(a,b,w,c){return {k:'s',a:a,b:b,w:w,c:c||'e'}}
function Pl(pts,c){return {k:'p',pts:pts,c:c||'pad'}}
function Dt(p,r,c){return {k:'d',p:p,r:r,c:c||'e'}}
function disc(p,axis,Rad,c){
  var ax=nrm(axis), t=Math.abs(ax[1])<0.9?[0,1,0]:[1,0,0];
  var e1=nrm(sub(t,mul(ax,dot(t,ax)))), e2=[ax[1]*e1[2]-ax[2]*e1[1],ax[2]*e1[0]-ax[0]*e1[2],ax[0]*e1[1]-ax[1]*e1[0]];
  var pts=[];for(var i=0;i<18;i++){var a=i/18*6.2832;pts.push(add(p,add(mul(e1,Math.cos(a)*Rad),mul(e2,Math.sin(a)*Rad))))}
  return Pl(pts,c||'plate');
}
function barbell(c,half,plateR,pos,axis){
  axis=axis||[1,0,0];var o=[S(add(c,mul(axis,-half)),add(c,mul(axis,half)),2.6,'bar')];
  for(var s=-1;s<=1;s+=2)pos.forEach(function(q){o.push(disc(add(c,mul(axis,s*q)),axis,plateR,'plate'))});
  return o;
}
function dumbbell(c,axis,hl,Rad){
  axis=axis||[0,0,1];hl=hl||7;Rad=Rad||6.5;
  return [S(add(c,mul(axis,-hl)),add(c,mul(axis,hl)),2.4,'bar'),disc(add(c,mul(axis,-hl)),axis,Rad,'plate'),disc(add(c,mul(axis,hl)),axis,Rad,'plate')];
}

/* ---------- cámara ---------- */
var VIEWS={lat:{yaw:90,pitch:6},fro:{yaw:0,pitch:6},tri:{yaw:48,pitch:10}};
function cam(view,cfg){
  var v=VIEWS[view],cy=Math.cos(v.yaw*R),sy=Math.sin(v.yaw*R),cp=Math.cos(v.pitch*R),sp=Math.sin(v.pitch*R);
  var c=cfg.c,s=cfg.s;
  return function(p){
    var x=p[0]-c[0],y=p[1]-c[1],z=p[2]-c[2];
    var sx=x*cy+z*sy, d=-x*sy+z*cy;
    return [130+sx*s, 128+(-(y*cp)+d*sp)*s, d];
  };
}

/* ---------- dibujo ---------- */
var FW={thigh:12,shin:9,uarm:8,farm:7,neck:7,torso:17,foot:5};
function f1(n){return n.toFixed(1)}
function bodyPrims(sk,hot,ghost){
  var o=[],H=function(ch){return hot.indexOf(ch)>=0?'h':'b'};
  function seg(a,b,w,c){o.push(S(a,b,w,ghost?'g':c))}
  for(var i=0;i<2;i++){
    seg(sk.hp[i],sk.kn[i],FW.thigh,H('l'));seg(sk.kn[i],sk.an[i],FW.shin,H('l')==='h'?'h':H('k'));
    seg(sk.an[i],sk.toe[i],FW.foot,H('k'));
    seg(sk.sh[i],sk.el[i],FW.uarm,H('a')==='h'?'h':H('u'));seg(sk.el[i],sk.wr[i],FW.farm,H('a'));
  }
  if(!sk.noTorso)seg(sk.P,sk.N,FW.torso,H('t'));
  seg(sk.N,add(sk.N,mul(nrm(sub(sk.H,sk.N)),9)),FW.neck,'b');
  if(!ghost){
    if(!sk.noTorso)o.push(Pl([sk.sh[0],sk.sh[1],sk.hp[1],sk.hp[0]],hot.indexOf('t')>=0?'torsoh':'torso'));
    o.push({k:'d',p:sk.H,r:HEADR,c:'head'});
    for(var j=0;j<2;j++){o.push(Dt(sk.el[j],2.4,'jt'));o.push(Dt(sk.kn[j],2.6,'jt'));o.push(Dt(sk.sh[j],3,'jt'))}
  }
  return o;
}
function floorPrims(){
  var o=[],i;
  for(i=-3;i<=3;i++){o.push(S([-90,0,i*30],[90,0,i*30],0.5,'f'));o.push(S([i*30,0,-90],[i*30,0,90],0.5,'f'))}
  return o;
}
function render(pr,cm,s,svgOpts){
  var items=[],i,p;
  pr.forEach(function(q){
    if(q.k==='s'){var A=cm(q.a),B=cm(q.b);items.push({d:(A[2]+B[2])/2,t:'<line x1="'+f1(A[0])+'" y1="'+f1(A[1])+'" x2="'+f1(B[0])+'" y2="'+f1(B[1])+'" class="'+q.c+'" stroke-width="'+f1(q.w*s*0.6)+'"/>',o:q.c})}
    else if(q.k==='p'){var pts=q.pts.map(cm),dd=0;pts.forEach(function(z){dd+=z[2]});items.push({d:dd/pts.length+(q.c==='torso'||q.c==='torsoh'?0:0),t:'<polygon points="'+pts.map(function(z){return f1(z[0])+','+f1(z[1])}).join(' ')+'" class="'+q.c+'"/>',o:q.c})}
    else if(q.k==='d'){var C=cm(q.p);items.push({d:C[2]+(q.c==='head'?2:3),t:'<circle cx="'+f1(C[0])+'" cy="'+f1(C[1])+'" r="'+f1(q.r*s)+'" class="'+q.c+'"/>',o:q.c})}
    else if(q.k==='a'){items.push({d:99,t:q.t,o:'m'})}
  });
  items.sort(function(a,b){return a.d-b.d});
  return items.map(function(x){return x.t}).join('');
}
function arcFor(a,b,c,cm,s){
  var u1=nrm(sub(a,b)),u2=nrm(sub(c,b)),n=[];
  var ang=Math.acos(clamp(dot(u1,u2),-1,1)),pts=[];
  for(var i=0;i<=10;i++){var q=nrm(mix(u1,u2,i/10));pts.push(cm(add(b,mul(q,12))))}
  return {k:'a',t:'<polyline points="'+pts.map(function(z){return f1(z[0])+','+f1(z[1])}).join(' ')+'" class="arc"/>',deg:ang/R};
}
var J={
  el:function(sk,i){return [sk.sh[i],sk.el[i],sk.wr[i]]},
  kn:function(sk,i){return [sk.hp[i],sk.kn[i],sk.an[i]]},
  hp:function(sk,i){return [sk.N,sk.hp[i],sk.kn[i]]},
  sh:function(sk,i){return [sub(sk.sh[i],mul(sk.u,50)),sk.sh[i],sk.el[i]]}
};

return {EX:EX,R:R,add:add,sub:sub,mul:mul,dot:dot,len:len,nrm:nrm,mix:mix,lerp:lerp,nlerp:nlerp,clamp:clamp,sm:sm,rotY:rotY,
  ik:ik,rig:rig,S:S,Pl:Pl,Dt:Dt,disc:disc,barbell:barbell,dumbbell:dumbbell,cam:cam,VIEWS:VIEWS,
  bodyPrims:bodyPrims,floorPrims:floorPrims,render:render,arcFor:arcFor,J:J,
  ikErr:function(){var e=ikErr;ikErr=0;return e}};
})();

/* Runner: tempo -> fases (baja / pausa / sube), cámara, ghosts del rango, medidor de ángulo, controles */
(function(G){
'use strict';
var tiles=[], reduce=false, slowAll=false;
try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
function ease(x){return 0.5-0.5*Math.cos(Math.PI*clamp(x,0,1))}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
var VN={lat:'Lado',fro:'Frente',tri:'3/4'};

function Tile(el){
  var key=el.getAttribute('data-ex'); this.el=el; this.def=G.EX[key]; if(!this.def) return;
  var tp=(el.getAttribute('data-tempo')||'').split('-').map(Number);if(tp.length!==3||tp.some(isNaN))tp=this.def.tempo||[2,0,2];
  this.tempo=tp; this.hold=+el.getAttribute('data-hold')||0;
  this.view=this.def.view||'lat'; this.t=0; this.paused=reduce; this.vis=false; this.last=0; this.slow=false;
  this.svg=el.querySelector('svg.stage'); this.build(); this.draw(0,0,0);
}
Tile.prototype.build=function(){
  var me=this,el=this.el,h='<div class="live"><b class="ph">&nbsp;</b><span class="tm"></span><span class="ang"></span></div><div class="ctl">';
  ['lat','fro','tri'].forEach(function(v){h+='<button type="button" data-v="'+v+'">'+VN[v]+'</button>'});
  h+='<button type="button" data-a="pp" aria-label="Pausar o reproducir">'+(this.paused?'▶':'❚❚')+'</button><button type="button" data-a="slow" aria-label="Cámara lenta">×½</button></div>';
  var box=document.createElement('div');box.className='livebox';box.innerHTML=h;
  el.insertBefore(box,el.querySelector('.phase'));
  this.ph=box.querySelector('.ph');this.tm=box.querySelector('.tm');this.ang=box.querySelector('.ang');
  box.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.getAttribute('data-v')){me.view=b.getAttribute('data-v');me.sync();me.redraw()}
    else if(b.getAttribute('data-a')==='pp'){me.paused=!me.paused;me.sync()}
    else{me.slow=!me.slow;me.sync()}
  });
  this.box=box;this.sync();
};
Tile.prototype.sync=function(){
  var me=this;[].forEach.call(this.box.querySelectorAll('button'),function(b){
    var v=b.getAttribute('data-v'),a=b.getAttribute('data-a');
    if(v)b.setAttribute('aria-pressed',String(v===me.view));
    if(a==='pp'){b.textContent=me.paused?'▶':'❚❚'}
    if(a==='slow')b.setAttribute('aria-pressed',String(me.slow));
  });
};
Tile.prototype.cycle=function(){
  var e=this.tempo[0],h=this.tempo[1],c=this.tempo[2];
  var d1=this.def.ecc?e:c, d3=this.def.ecc?c:e;
  return {dw:0.5,d1:d1,d2:h,d3:d3,total:0.5+d1+h+d3};
};
Tile.prototype.state=function(){
  var d=this.def;
  if(d.iso){var hs=this.hold||30,k=this.t%hs;return {p:1,rep:Math.floor(this.t/hs),ph:d.phLabel||'MANTÉN',tm:Math.floor(k)+' / '+hs+' s',time:this.t}}
  var C=this.cycle(),rep=Math.floor(this.t/C.total),c=this.t-rep*C.total,p,ph,rem,L=d.lab||['BAJA','SUBE'];
  if(c<C.dw){p=0;ph='LISTO';rem=C.dw-c}
  else if(c<C.dw+C.d1){var x=(c-C.dw)/C.d1;p=ease(x);ph=L[0];rem=C.d1*(1-x)}
  else if(c<C.dw+C.d1+C.d2){p=1;ph='PAUSA';rem=C.dw+C.d1+C.d2-c}
  else{var y=(c-C.dw-C.d1-C.d2)/C.d3;p=1-ease(y);ph=L[1];rem=C.d3*(1-y)}
  return {p:p,rep:rep,ph:ph,tm:rem.toFixed(1)+' s',time:this.t};
};
Tile.prototype.redraw=function(){var s=this.state();this.draw(s.p,s.rep,s.time,s)};
Tile.prototype.draw=function(p,rep,time,st){
  var d=this.def,cfg=d.cam,cm=G.cam(this.view,cfg),s=cfg.s;
  var P=d.pose(p,rep,time),sk=G.rig(P.o),hot=d.hot||'';
  var ghosts='';
  [0,1].forEach(function(q){var gp=d.pose(q,rep,0),gs=G.rig(gp.o);ghosts+=G.render(G.bodyPrims(gs,'',true),cm,s)});
  var pr=G.floorPrims().concat(P.eq||[]).concat(G.bodyPrims(sk,hot,false));
  var meas='';
  if(P.m){var tr=G.J[P.m[0]](sk,P.m[1]),ar=G.arcFor(tr[0],tr[1],tr[2],cm,s);pr.push(ar);this.deg=ar.deg;this.mlab=P.m[2]}
  this.svg.innerHTML='<g class="ghostg">'+ghosts+'</g>'+G.render(pr,cm,s);
  if(st){this.ph.textContent=(st.ph==='LISTO'?'':st.ph)||'INICIO';this.ph.className='ph '+st.ph.toLowerCase();
    this.tm.textContent=d.iso?st.tm:(st.ph==='LISTO'?'Rep '+(st.rep+1):st.tm+' · Rep '+(st.rep+1));
    this.ang.textContent=this.mlab?this.mlab+' '+Math.round(this.deg)+'°':''}
};
Tile.prototype.tick=function(now){
  if(!this.vis||this.paused){this.last=now;return}
  var dt=Math.min(0.1,(now-this.last)/1000);this.last=now;
  this.t+=dt*(this.slow?0.5:1);this.redraw();
};

var looping=false;
function loop(now){
  for(var j=tiles.length-1;j>=0;j--)if(!tiles[j].el.isConnected)tiles.splice(j,1);
  if(!document.hidden)for(var i=0;i<tiles.length;i++)tiles[i].tick(now);
  if(tiles.length)requestAnimationFrame(loop);else looping=false;
}
G.mount=function(el){var t=new Tile(el);if(!t.def)return null;t.vis=true;t.last=performance.now();tiles.push(t);if(!looping){looping=true;requestAnimationFrame(loop)}return t};
G.init=function(){
  [].forEach.call(document.querySelectorAll('.pictile[data-ex]'),function(el){var t=new Tile(el);if(t.def)tiles.push(t)});
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){
      for(var i=0;i<tiles.length;i++)if(tiles[i].el===e.target){tiles[i].vis=e.isIntersecting;tiles[i].last=performance.now()}
    })},{threshold:0.25});
    tiles.forEach(function(t){io.observe(t.el)});
  }else tiles.forEach(function(t){t.vis=true});
  requestAnimationFrame(loop);
  return tiles;
};
G.tiles=tiles;

function googleSub(){
  googleUnsub();
  var merge=function(coll,local,isDoc){
    var first=true;
    return function(snap){
      var remote={};
      snap.docs.forEach(function(d){
        var r=d.data();remote[d.id]=r;
        if(Store.dirty[coll+'/'+d.id])return;
        var l=local()[d.id];
        if(!l||(r._t||0)>=(l._t||0))local()[d.id]=r;
      });
      if(first){first=false;var L=local();Object.keys(L).forEach(function(k){var r=remote[k];if(!r||(L[k]._t||0)>(r._t||0))fbWrite(coll+'/'+k,L[k])})}

    };
  };
  var err=function(e){toast('No se pudo sincronizar con Google'+(e&&e.code?' ('+e.code+')':''))};
  GG.unsub.push(GG.db.collection(upath('days')).onSnapshot(merge('days',function(){return S.days}),err));
  GG.unsub.push(GG.db.collection(upath('shop')).onSnapshot(merge('shop',function(){return S.shop}),err));
  var firstS=true;
  GG.unsub.push(GG.db.doc(upath('settings/main')).onSnapshot(function(s){
    var r=s.exists?s.data():null;

    else if(firstS&&(!r||(S.settings._t||0)>(r._t||0)))fbWrite('settings/main',S.settings);
    firstS=false;Store.saveLocal();soon();
  },err));
}

/* ---------- gastos ---------- */
function money(n){var v=Math.round((n||0)*100)/100;return v.toLocaleString('es-MX',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})}

  var sh=S.shop[ws]||{},c=sh.cost||{},r={list:0,pantry:0,extra:0,total:0};
  Object.keys(c).forEach(function(k){var v=num(c[k])||0;if(k.charAt(0)==='p')r.pantry+=v;else r.list+=v});
  (sh.extra||[]).forEach(function(x){r.extra+=num(x.c)||0});
  r.total=r.list+r.pantry+r.extra;return r;
}
function monthSpend(d){
  var dt=parse(d),y=dt.getFullYear(),m=dt.getMonth(),first=iso(new Date(y,m,1)),w=weekStart(first),weeks=[],tot=0,reg=0;
  if(parse(w).getMonth()!==m)w=addDays(w,7);

  return {weeks:weeks,total:tot,reg:reg};
}

function dayReq(d){var p=plan(d),o=S.days[d]||{},ok=true;if(p.train&&!o.workout)ok=false;if(p.abs&&!o.absDone)ok=false;return ok}
function trackStart(){
  var skip={date:1,source:1,weight:1,weightPM:1,_t:1};
  var ks=Object.keys(S.days).filter(function(k){var o=S.days[k];return Object.keys(o).some(function(x){return !skip[x]})}).sort();
  return ks[0]||today();
}
function streakInfo(){
  var st=trackStart(),t=today(),run=0,best=0,d=st;
  while(d<t){if(dayReq(d)){run++;if(run>best)best=run}else run=0;d=addDays(d,1)}
  var cur=run;if(dayReq(t)){cur++}if(cur>best)best=cur;
  return {cur:cur,best:best,todayDone:dayReq(t),start:st};
}

  if(b.id==='tplus'){T.end+=15000;T.beeped=false;tick();return}
  if(b.id==='tminus'){T.end-=15000;tick();return}
  if(b.id==='exportxls'){var sel=document.getElementById('expmonth');exportMonth(sel?sel.value:today().slice(0,7));return}

  if(a('data-go')){go(a('data-go'));return}
  if(a('data-q')){var q=+a('data-q');setDay(function(o){o.sleep=o.sleep||{};o.sleep.q=o.sleep.q===q?null:q});render();return}

  if(a('data-flag')){var f=a('data-flag');setDay(function(o){o[f]=!o[f]});render();if(f==='workout')checkBadges();return}

  if(a('data-sup')){var s=a('data-sup');setDay(function(o){o.sup=o.sup||{};o.sup[s]=!o.sup[s]});render();return}
  if(a('data-water')){var g=+a('data-water');setDay(function(o){o.water=(o.water===g)?g-1:g});render();return}
  if(a('data-abs')){var x=a('data-abs');setDay(function(o){o.abs=o.abs||{};o.abs[x]=!o.abs[x];var A=D.AB[plan(S.date).abs];if(A)o.absDone=A.ex.every(function(e){return o.abs[e.id]})});render();checkBadges();return}
  if(a('data-open')){var k=a('data-open');S.open[k]=!S.open[k];render();return}
  if(a('data-tech')){openTech(a('data-src'));return}
  if(a('data-routine')){S.routine=a('data-routine');render();return}
  if(a('data-warm')){var wk=a('data-warm'),key=S.routine||plan(S.date).train;setDay(function(o){o.warm=o.warm||{};o.warm[wk]=!o.warm[wk];var R=D.R[key];if(R)o.warmDone=D.W[R.warm].items.every(function(it){return o.warm[it.key]})});render();return}
  if(a('data-ok')){var pr=a('data-ok').split(':'),id=pr[0],i=+pr[1],was;
    setDay(function(o){o.lifts=o.lifts||{};var L=o.lifts[id]=o.lifts[id]||[];while(L.length<=i)L.push({kg:'',r:'',ok:false});was=L[i].ok;L[i].ok=!L[i].ok});
    if(!was)startTimer(+a('data-rest'),a('data-name'));render();return}
  if(a('data-finish')){var ff=a('data-finish');setDay(function(o){o[ff]=!o[ff]});render();if(day()[ff]){toast('Entrenamiento guardado');checkBadges()}return}
  if(a('data-mdow')){S.menuDow=+a('data-mdow');render();return}
  if(a('data-shop')){var it=a('data-shop'),ws=weekStart(S.date);setShop(ws,function(o){o.items=o.items||{};o.items[it]=!o.items[it];o.week=ws});render();return}
  if(a('data-wr')){S.wr=a('data-wr');render();return}
  if(a('data-addextra')){var w0=weekStart(S.date);setShop(w0,function(o){o.extra=o.extra||[];o.extra.push({n:'',c:null});o.week=w0});render();var ins=document.querySelectorAll('[data-extra-n]');if(ins.length)ins[ins.length-1].focus();return}
  if(a('data-delextra')){var w1=weekStart(S.date),di=+a('data-delextra');setShop(w1,function(o){o.extra=(o.extra||[]).filter(function(x,j){return j!==di})});render();return}
  if(a('data-wsrc')){S.wsrc=a('data-wsrc');render();return}
  if(b.id==='gsignin'){googleSignIn();return}
  if(b.id==='gsignout'){googleSignOut();return}
  if(a('data-toggle-dl')){var w=a('data-toggle-dl'),cur=wi(w).deload;setSettings(function(o){o.overrides=o.overrides||{};o.overrides[w]=!cur});render();return}
});
document.addEventListener('change',function(ev){
  var el=ev.target,a=function(n){return el.getAttribute(n)};
  if(el.id==='sbed'||el.id==='swake'){var k=a('data-k');setDay(function(o){o.sleep=o.sleep||{};o.sleep[k]=el.value||null});soon();return}
  if(a('data-f')){var f=a('data-f'),v=el.value.trim();setDay(function(o){if(f==='notes')o.notes=v;else{var n=num(v);if(n==null)delete o[f];else o[f]=f==='steps'?Math.round(n):n}});soon();return}
  if(a('data-set')){var p=a('data-set').split(':'),id=p[0],i=+p[1],fld=p[2],val=el.value.trim();
    setDay(function(o){o.lifts=o.lifts||{};var L=o.lifts[id]=o.lifts[id]||[];while(L.length<=i)L.push({kg:'',r:'',ok:false});L[i][fld]=val});return}
  if(a('data-cost')){var ck=a('data-cost'),cv=num(el.value),w2=weekStart(S.date);setShop(w2,function(o){o.cost=o.cost||{};if(cv==null)delete o.cost[ck];else o.cost[ck]=cv;o.week=w2});soon();return}
  if(a('data-extra-n')!=null||a('data-extra-c')!=null){var w3=weekStart(S.date),isN=a('data-extra-n')!=null,ei=+(isN?a('data-extra-n'):a('data-extra-c'));setShop(w3,function(o){o.extra=o.extra||[];o.extra[ei]=o.extra[ei]||{n:'',c:null};if(isN)o.extra[ei].n=el.value.trim();else o.extra[ei].c=num(el.value)});soon();return}
  if(a('data-steps')){var sk2=a('data-steps'),nv=num(el.value);setDay(function(o){
      if(o.stepsAM==null&&o.stepsPM==null&&o.steps!=null&&sk2==='stepsPM')o.stepsAM=o.steps;
      if(nv==null)delete o[sk2];else o[sk2]=Math.round(nv);
      var t=(o.stepsAM||0)+(o.stepsPM||0);if(t)o.steps=t;else delete o.steps});soon();return}
  if(a('data-pain')){var pk=a('data-pain');setDay(function(o){o.pain=o.pain||{};o.pain[pk]=+el.value});soon();return}
  if(el.id==='exsel'){S.chartEx=el.value;render();return}
  if(el.id==='expmonth'){S.expMonth=el.value;return}
  if(el.id==='impfile'&&el.files&&el.files[0]){var fr=new FileReader();fr.onload=function(){importBackup(String(fr.result))};fr.onerror=function(){toast('No se pudo leer el archivo')};fr.readAsText(el.files[0]);return}
  if(a('data-setting')){var sk=a('data-setting'),sv=el.value;setSettings(function(o){if(sk==='stepGoal'){var n=num(sv);if(n)o.stepGoal=Math.round(n)}else if(sk==='goalWeight'){var g=num(sv);if(g)o.goalWeight=g;else delete o.goalWeight}else if(sv)o[sk]=weekStart(sv)});soon();return}
});
document.addEventListener('input',function(ev){var el=ev.target;if(el.getAttribute('data-pain')){var b=el.parentNode.querySelector('b');if(b)b.textContent=el.value}});
document.getElementById('sheet').addEventListener('click',function(ev){if(ev.target.id==='sheet')closeTech()});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!document.getElementById('sheet').hidden)closeTech()});

render();status();Store.init();googleInit();
if(S.pendingTimer&&S.pendingTimer.end>Date.now()-60000)startTimer(0,S.pendingTimer.name,S.pendingTimer.end);
setTimeout(function(){if(S.scroll&&S.scroll[S.tab])window.scrollTo(0,S.scroll[S.tab]);maybeWelcome();checkBadges()},350);
})();

</script>
